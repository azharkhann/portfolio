a\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"784\" y1=\"1302\" x2=\"784\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1140\" y1=\"1302\" x2=\"1140\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1497\" y1=\"1302\" x2=\"1497\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1853\" y1=\"1302\" x2=\"1853\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<text x=\"88\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">450 · 3,650<\u002Ftext><text x=\"88\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">production workflows · callable services<\u002Ftext>\n<text x=\"445\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">97.6%<\u002Ftext><text x=\"445\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">completion across 24.5M runs over five years<\u002Ftext>\n<text x=\"802\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">20<\u002Ftext><text x=\"802\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">AI use cases in production, no rewrites<\u002Ftext>\n<text x=\"1158\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">170M<\u002Ftext><text x=\"1158\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">tasks orchestrated<\u002Ftext>\n<text x=\"1515\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">0<\u002Ftext><text x=\"1515\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">business-interrupting outages<\u002Ftext>\n<text x=\"1871\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">11<\u002Ftext><text x=\"1871\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11\">9 acquisitions · 1 rebrand · 1 country launch, as configuration<\u002Ftext>\n<g class=\"ov\" id=\"ov-receipts\" opacity=\"0\">\n<text x=\"70\" y=\"1408\" fill=\"#8a95a0\" font-size=\"13\" letter-spacing=\"1.5\" font-weight=\"700\">RECEIPTS PER LINE<\u002Ftext>\n<text x=\"266\" y=\"1408\" fill=\"#9aa4ad\" font-size=\"12\" font-style=\"italic\">measured in production, not projected<\u002Ftext>\n<rect x=\"70\" y=\"1420\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#c2417f\"><\u002Frect>\n<text x=\"96\" y=\"1432\" fill=\"#c2417f\" font-size=\"12.5\" font-weight=\"700\">DEMAND-TO-LEAD<\u002Ftext>\n<text x=\"360\" y=\"1432\" fill=\"#4a5560\" font-size=\"12.5\">dynamic call tracking across ~80 offices · partner leads and web forms land as CRM leads · conversions return to the ad platforms<\u002Ftext>\n<rect x=\"70\" y=\"1447\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#e8963d\"><\u002Frect>\n<text x=\"96\" y=\"1459\" fill=\"#e8963d\" font-size=\"12.5\" font-weight=\"700\">HIRE-TO-RETIRE<\u002Ftext>\n<text x=\"360\" y=\"1459\" fill=\"#4a5560\" font-size=\"12.5\">10,000+ hires a year, zero orphaned accounts · lifecycle events carry compensating transactions · identity provisioned and revoked as workflow<\u002Ftext>\n<rect x=\"70\" y=\"1474\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#2f9e4f\"><\u002Frect>\n<text x=\"96\" y=\"1486\" fill=\"#2f9e4f\" font-size=\"12.5\" font-weight=\"700\">LEAD-TO-CASH<\u002Ftext>\n<text x=\"360\" y=\"1486\" fill=\"#4a5560\" font-size=\"12.5\">rate letters machine-drafted, director-approved, then locked · invoicing reads curated bill items · payment presentment through the gateway<\u002Ftext>\n<rect x=\"70\" y=\"1501\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#3b76d0\"><\u002Frect>\n<text x=\"96\" y=\"1513\" fill=\"#3b76d0\" font-size=\"12.5\" font-weight=\"700\">ORDER-TO-FULFILLMENT<\u002Ftext>\n<text x=\"360\" y=\"1513\" fill=\"#4a5560\" font-size=\"12.5\">scheduling syncs on nightly windows with count reconciliation checks · a missing location auto-opens a vendor ticket · one compliance feed per regulation<\u002Ftext>\n<rect x=\"70\" y=\"1528\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#8b4fd8\"><\u002Frect>\n<text x=\"96\" y=\"1540\" fill=\"#8b4fd8\" font-size=\"12.5\" font-weight=\"700\">PROCURE-TO-PAY<\u002Ftext>\n<text x=\"360\" y=\"1540\" fill=\"#4a5560\" font-size=\"12.5\">supplier master syncs from contractor records · an FX validation gate guards the ledger · refunds run form-to-approval-to-payment unattended<\u002Ftext>\n<rect x=\"70\" y=\"1555\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#3f9b8e\"><\u002Frect>\n<text x=\"96\" y=\"1567\" fill=\"#3f9b8e\" font-size=\"12.5\" font-weight=\"700\">ISSUE-TO-RESOLUTION<\u002Ftext>\n<text x=\"360\" y=\"1567\" fill=\"#4a5560\" font-size=\"12.5\">the case management upserts contacts from every system of record · surveys go out and come back · every call becomes analyzable text<\u002Ftext>\n<rect x=\"70\" y=\"1582\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#d0392e\"><\u002Frect>\n<text x=\"96\" y=\"1594\" fill=\"#d0392e\" font-size=\"12.5\" font-weight=\"700\">PLATFORM OPERATIONS<\u002Ftext>\n<text x=\"360\" y=\"1594\" fill=\"#4a5560\" font-size=\"12.5\">~90% of a 30,000-ticket queue machine-opened · 9 tickets per 10,000 jobs · humans on exceptions only<\u002Ftext>\n<rect x=\"70\" y=\"1609\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#c9a227\"><\u002Frect>\n<text x=\"96\" y=\"1621\" fill=\"#c9a227\" font-size=\"12.5\" font-weight=\"700\">ACTIVATION · REVERSE-ETL<\u002Ftext>\n<text x=\"360\" y=\"1621\" fill=\"#4a5560\" font-size=\"12.5\">the platform writes back: CRM records, survey audiences, SMS contacts, wage files, ad conversions, partner feeds<\u002Ftext>\n<\u002Fg>\n<rect x=\"70\" y=\"1660\" width=\"2140\" height=\"2\" fill=\"#16324c\"><\u002Frect>\n<circle cx=\"88\" cy=\"1689\" r=\"9\" fill=\"#16324c\"><\u002Fcircle><text x=\"106\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">runs autonomously<\u002Ftext>\n<circle cx=\"270\" cy=\"1689\" r=\"10\" fill=\"#fff\" stroke=\"#16324c\" stroke-width=\"4\"><\u002Fcircle><text x=\"290\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">human-in-the-loop<\u002Ftext>\n<rect x=\"452\" y=\"1678\" width=\"22\" height=\"22\" rx=\"6\" fill=\"#fff\" stroke=\"#16324c\" stroke-width=\"4\"><\u002Frect><text x=\"486\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">master orchestration<\u002Ftext>\n<rect x=\"656\" y=\"1674\" width=\"24\" height=\"32\" rx=\"12\" fill=\"#fff\" stroke=\"#16324c\" stroke-width=\"3.5\"><\u002Frect><text x=\"692\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">shared system, multiple streams<\u002Ftext>\n<rect x=\"946\" y=\"1681\" width=\"14\" height=\"14\" rx=\"3\" transform=\"rotate(45 953 1688)\" fill=\"#fff\" stroke=\"#4a90c2\" stroke-width=\"2\"><\u002Frect><text x=\"972\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">applied ML · extraction<\u002Ftext>\n<line x1=\"1120\" y1=\"1689\" x2=\"1168\" y2=\"1689\" stroke=\"#d0392e\" stroke-width=\"2.5\" stroke-dasharray=\"8 6\"><\u002Fline><text x=\"1178\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">exception feed<\u002Ftext>\n<line x1=\"1310\" y1=\"1689\" x2=\"1358\" y2=\"1689\" stroke=\"#c9a227\" stroke-width=\"5\"><\u002Fline><text x=\"1368\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">activation loop<\u002Ftext>\n<line x1=\"1510\" y1=\"1689\" x2=\"1558\" y2=\"1689\" stroke=\"#b0483a\" stroke-width=\"3\" stroke-dasharray=\"9 7\"><\u002Fline><text x=\"1568\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">off-network<\u002Ftext>\n<text x=\"2210\" y=\"1682\" fill=\"#5b6b7a\" font-size=\"11\" font-weight=\"700\" letter-spacing=\"1.5\" text-anchor=\"end\">DIAGRAM 02 / 03 · NATIONAL HOME CARE: OPERATIONS<\u002Ftext>\n<text x=\"2210\" y=\"1699\" fill=\"#9aa4ad\" font-size=\"12\" text-anchor=\"end\">Live deployment · in production since 2021<\u002Ftext>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"maplegend\">hover any station for what runs there · toggle the layers · drag to pan · full screen top right · <span style=\"color:var(--hum)\">the solid mark is a person acting<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n  <p class=\"closer\">The same five blocks run the next three transformations.<\u002Fp>\n  <p class=\"fine\">Nine acquisitions, one rebrand, and one country launch have landed as configuration changes since, without a platform rebuild.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"case\" id=\"case-ems\">\n  <div class=\"entry\">Transformation 02 · EMS<\u002Fdiv>\n  <p class=\"scene\"><i>02:14<\u002Fi> · one invoice in a hundred falls below the confidence line. The twin holds it.<\u002Fp>\n  <h3 class=\"lede\">A $1B-a-year payments operation runs on one digital twin.<\u002Fh3>\n  <div class=\"sir\">\n    <div class=\"sir-row\"><div class=\"k\">Mechanism<\u002Fdiv><div class=\"v\">Process mining → digital twin: <b>a live control loop that flags deviations and names the next automation.<\u002Fb> Entity resolution across 15,000+ vendors gives the twin its golden record.<\u002Fdiv><\u002Fdiv>\n    <div class=\"sir-row\"><div class=\"k\">Scale<\u002Fdiv><div class=\"v\">180+ clients · 15,000+ vendors · 300+ layouts · 700K invoices a month, toward 1M.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"band\">\n    <div class=\"b1\"><div class=\"bn\">90 → 30<\u002Fdiv><div class=\"bt\">days: client onboarding, recovering roughly $800K a month in contracted revenue that used to sit idle<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn\">$0.58 → $0.21<\u002Fdiv><div class=\"bt\">per invoice, worth about $3M a year; processing time from 8 minutes to under 1<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn\">65% → 99%<\u002Fdiv><div class=\"bt\">accuracy, from hand-keyed to governed<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn red\">1 in 100<\u002Fdiv><div class=\"bt\">invoices held for a person's review<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"decs\">\n    <div class=\"dec\"><b>Revenue:<\u002Fb> new data products on the same base: forecasting, rate optimization, benchmarking, Scope 1/2.<\u002Fdiv>\n    <div class=\"dec\"><b>Workforce:<\u002Fb> 290 keyers redeployed into 65 exception analysts and pattern-builders.<\u002Fdiv>\n    <div class=\"dec\"><b>CX:<\u002Fb> clients see fewer disputes and faster resolution when one surfaces.<\u002Fdiv>\n    <div class=\"dec\"><b>Visibility:<\u002Fb> the twin surfaces every deviation with the fix already named, before a client has to ask.<\u002Fdiv>\n  <\u002Fdiv>\n  \n<div class=\"mapshell rv\">\n<div class=\"maphost\" data-map=\"ems\"><button class=\"fsbtn\" type=\"button\" aria-label=\"View map full screen\">⛶ Full screen<\u002Fbutton><div class=\"avm-root\" id=\"avm-ems\" data-variant=\"a\">\n<div class=\"avm-bar\" role=\"toolbar\">\n<span class=\"avm-lab\">LAYERS<\u002Fspan>\n<div class=\"avm-grp\">\n<button class=\"avm-tgl\" data-ov=\"activation\" aria-pressed=\"false\">Loop detail<\u002Fbutton>\n<button class=\"avm-tgl\" data-ov=\"exceptions\" aria-pressed=\"false\">Exceptions<\u002Fbutton>\n<button class=\"avm-tgl\" data-ov=\"offnet\" aria-pressed=\"true\">Off-network<\u002Fbutton>\n<button class=\"avm-tgl\" data-ov=\"receipts\" aria-pressed=\"false\">How to read it<\u002Fbutton>\n<\u002Fdiv>\n<span class=\"avm-spacer\"><\u002Fspan>\n<button class=\"avm-print\" type=\"button\" id=\"printBtn-ems\">Print<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"avm-svgscroll\">\n<div id=\"tip-ems\" class=\"map-tip\" role=\"status\"><\u002Fdiv>\n<svg id=\"map-ems\" viewBox=\"0 220 2280 1040\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect width=\"2280\" height=\"1780\" fill=\"#fff\"><\u002Frect>\n<rect x=\"70\" y=\"44\" width=\"30\" height=\"22\" rx=\"2\" fill=\"#16324c\"><\u002Frect><text x=\"85\" y=\"60\" fill=\"#fff\" font-size=\"12.5\" font-weight=\"800\" text-anchor=\"middle\">03<\u002Ftext>\n<text x=\"114\" y=\"60\" fill=\"#5b6b7a\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"2.5\">AGENTIC ORCHESTRATION · UTILITY BILL MANAGEMENT: DATA PLATFORM<\u002Ftext>\n<text x=\"2210\" y=\"60\" fill=\"#9aa4ad\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"2\" text-anchor=\"end\">DIAGRAM 03 / 03<\u002Ftext>\n<text x=\"70\" y=\"112\" fill=\"#16324c\" font-size=\"44\" font-weight=\"800\">The operation that turns its data into a moat.<\u002Ftext>\n<text x=\"70\" y=\"142\" fill=\"#3a4750\" font-size=\"17\">Every field of 700,000 invoices a month lands in one governed digital twin, then becomes analytics, benchmarking, and ML forecasts. Payment is the byproduct; the data is a moat no competitor can buy.<\u002Ftext>\n<rect x=\"70\" y=\"158\" width=\"2140\" height=\"2.5\" fill=\"#16324c\"><\u002Frect>\n<line x1=\"498\" y1=\"166\" x2=\"498\" y2=\"214\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"926\" y1=\"166\" x2=\"926\" y2=\"214\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1354\" y1=\"166\" x2=\"1354\" y2=\"214\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1782\" y1=\"166\" x2=\"1782\" y2=\"214\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"70\" y1=\"216\" x2=\"2210\" y2=\"216\" stroke=\"#d3d8dd\" stroke-width=\"1.5\"><\u002Fline>\n<text x=\"88\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">DATA<\u002Ftext><text x=\"88\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">one source of truth · every system feeds it · every decision reads it<\u002Ftext>\n<text x=\"516\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">IDENTITY<\u002Ftext><text x=\"516\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">every action has a name on it: human, robot, or agent<\u002Ftext>\n<text x=\"944\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">OBSERVABILITY<\u002Ftext><text x=\"944\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">the platform watches itself · every job reports what it did<\u002Ftext>\n<text x=\"1372\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">EXCEPTIONS<\u002Ftext><text x=\"1372\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">failures arrive with instructions: retry, halt, or hand to a person<\u002Ftext>\n<text x=\"1800\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">GOVERNANCE<\u002Ftext><text x=\"1800\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">nothing ships without review · nothing stays without reason<\u002Ftext>\n<rect x=\"70\" y=\"226\" width=\"2140\" height=\"1030\" rx=\"26\" fill=\"#fff\" stroke=\"#e4e7ea\" stroke-width=\"1.5\"><\u002Frect>\n<rect x=\"71\" y=\"227\" width=\"2138\" height=\"1028\" rx=\"26\" fill=\"#f9f7f1\" opacity=\".5\"><\u002Frect>\n<text x=\"96\" y=\"252\" fill=\"#9aa4ad\" font-size=\"12.5\" font-style=\"italic\">Ontology underneath · twin in between · traces on top. One linear spine of intake feeds the twin; the twin makes the products and stays live off their loop. Substrate identical across care, EMS, and fintech; only the flow changes.<\u002Ftext>\n<rect x=\"112\" y=\"268\" width=\"1976\" height=\"62\" rx=\"12\" fill=\"#f2f4f6\" stroke=\"#cfd5da\" stroke-width=\"1.5\" stroke-dasharray=\"9 7\"><\u002Frect>\n<text x=\"132\" y=\"293\" fill=\"#5b6b7a\" font-size=\"12.5\" font-weight=\"800\" letter-spacing=\".5\">EXECUTION TRACES · OBSERVABILITY<\u002Ftext>\n<text x=\"132\" y=\"316\" fill=\"#7a8894\" font-size=\"11.5\">every agent's decision · path · outcome · error, captured, the exhaust that makes the system auditable: feeds the evals · becomes the typed error catalog · retrains the model<\u002Ftext>\n<text x=\"2068\" y=\"303\" fill=\"#9aa4ad\" font-size=\"11\" font-weight=\"700\" text-anchor=\"end\">TRACES ON TOP<\u002Ftext>\n<rect x=\"112\" y=\"1066\" width=\"1976\" height=\"114\" rx=\"12\" fill=\"#f2f4f6\" stroke=\"#cfd5da\" stroke-width=\"1.5\" stroke-dasharray=\"9 7\"><\u002Frect>\n<text x=\"132\" y=\"1096\" fill=\"#5b6b7a\" font-size=\"13\" font-weight=\"800\" letter-spacing=\".5\">ONTOLOGY<\u002Ftext>\n<text x=\"132\" y=\"1116\" fill=\"#8a95a0\" font-size=\"11\" font-style=\"italic\">the ground the<\u002Ftext>\n<text x=\"132\" y=\"1132\" fill=\"#8a95a0\" font-size=\"11\" font-style=\"italic\">twin is modeled on<\u002Ftext>\n<line x1=\"300\" y1=\"1082\" x2=\"300\" y2=\"1164\" stroke=\"#d3d8dd\" stroke-width=\"1.5\"><\u002Fline>\n<text x=\"322\" y=\"1100\" fill=\"#5b6b7a\" font-size=\"12\" font-weight=\"700\">BUSINESS ONTOLOGY<\u002Ftext>\n<text x=\"322\" y=\"1122\" fill=\"#5a5560\" font-size=\"11.5\">what a bill, a vendor, a site, a meter, and a decision<\u002Ftext>\n<text x=\"322\" y=\"1140\" fill=\"#5a5560\" font-size=\"11.5\">mean, and how they connect<\u002Ftext>\n<line x1=\"900\" y1=\"1082\" x2=\"900\" y2=\"1164\" stroke=\"#d3d8dd\" stroke-width=\"1.5\"><\u002Fline>\n<text x=\"922\" y=\"1100\" fill=\"#5b6b7a\" font-size=\"12\" font-weight=\"700\">TECHNICAL ONTOLOGY<\u002Ftext>\n<text x=\"922\" y=\"1122\" fill=\"#5a5560\" font-size=\"11.5\">which system holds what · one vendor, site, and meter reconciled across the<\u002Ftext>\n<text x=\"922\" y=\"1140\" fill=\"#5a5560\" font-size=\"11.5\">source systems, so the twin models one operation end to end<\u002Ftext>\n<text x=\"2068\" y=\"1100\" fill=\"#9aa4ad\" font-size=\"11\" font-weight=\"700\" text-anchor=\"end\">ONTOLOGY UNDERNEATH<\u002Ftext>\n<text x=\"2068\" y=\"1120\" fill=\"#9aa4ad\" font-size=\"10\" font-style=\"italic\" text-anchor=\"end\">the ground the twin is modeled on<\u002Ftext>\n<line x1=\"940\" y1=\"556\" x2=\"940\" y2=\"332\" stroke=\"#9aa4ad\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\" opacity=\".7\"><\u002Fline>\n<line x1=\"1040\" y1=\"556\" x2=\"1040\" y2=\"332\" stroke=\"#9aa4ad\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\" opacity=\".7\"><\u002Fline>\n<line x1=\"1140\" y1=\"556\" x2=\"1140\" y2=\"332\" stroke=\"#9aa4ad\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\" opacity=\".7\"><\u002Fline>\n<text x=\"985\" y=\"430\" fill=\"#9aa4ad\" font-size=\"10\" font-style=\"italic\" text-anchor=\"middle\">every job &amp; model → traces<\u002Ftext>\n<line x1=\"940\" y1=\"884\" x2=\"940\" y2=\"1064\" stroke=\"#bcc3ca\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\" opacity=\".7\"><\u002Fline>\n<line x1=\"1040\" y1=\"884\" x2=\"1040\" y2=\"1064\" stroke=\"#bcc3ca\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\" opacity=\".7\"><\u002Fline>\n<line x1=\"1140\" y1=\"884\" x2=\"1140\" y2=\"1064\" stroke=\"#bcc3ca\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\" opacity=\".7\"><\u002Fline>\n<text x=\"1040\" y=\"1000\" fill=\"#8a95a0\" font-size=\"10\" font-style=\"italic\" text-anchor=\"middle\">the twin resolves meaning here · one vendor, site &amp; meter across systems<\u002Ftext>\n<text x=\"150\" y=\"662\" fill=\"#8a95a0\" font-size=\"12.5\" font-weight=\"800\" letter-spacing=\"1\">INTAKE · CAPTURE → EXTRACTION<\u002Ftext>\n<path d=\"M150 720 L820 720\" fill=\"none\" stroke=\"#16324c\" stroke-width=\"11\"><\u002Fpath>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Structured EDI invoices land on a schedule; publisher/subscriber recipes decouple intake from extraction.\" data-name=\"EDI Feeds\" data-line=\"INTAKE · CAPTURE\"><circle cx=\"210\" cy=\"720\" r=\"9\" fill=\"#16324c\"><\u002Fcircle><text x=\"210\" y=\"752\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">EDI Feeds<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Vendor portals harvested by unattended robots where no feed exists · logins, downloads, and posting run as recipes.\" data-name=\"Portal Harvest\" data-line=\"INTAKE · CAPTURE\"><circle cx=\"330\" cy=\"720\" r=\"9\" fill=\"#16324c\"><\u002Fcircle><text x=\"330\" y=\"700\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Portal Harvest<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Paper and PDF bills scanned and queued; the tail no channel reaches still funnels to one intake.\" data-name=\"Mail / Scan\" data-line=\"INTAKE · CAPTURE\"><circle cx=\"450\" cy=\"720\" r=\"9\" fill=\"#16324c\"><\u002Fcircle><text x=\"450\" y=\"752\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Mail / Scan<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Meter reads and interval data land alongside the bills · consumption joins the same reconciled source as spend.\" data-name=\"Meter Data\" data-line=\"INTAKE · CAPTURE\"><circle cx=\"570\" cy=\"720\" r=\"9\" fill=\"#16324c\"><\u002Fcircle><text x=\"570\" y=\"700\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Meter Data<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"A model routes each bill to its layout family across 300+ formats; unseen layouts queue for a pattern-builder. Applied ML · classification, not reasoning.\" data-name=\"Layout Classify\" data-line=\"EXTRACTION\"><rect x=\"662\" y=\"708\" width=\"24\" height=\"24\" rx=\"3\" transform=\"rotate(45 674 720)\" fill=\"#fff\" stroke=\"#4a90c2\" stroke-width=\"2.5\"><\u002Frect><text x=\"674\" y=\"752\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Layout Classify<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Document intelligence pulls line items, charges, and meter reads; deterministic rules first, the model on the residual. Applied ML · extraction, not reasoning.\" data-name=\"Field Extraction\" data-line=\"EXTRACTION\"><rect x=\"758\" y=\"708\" width=\"24\" height=\"24\" rx=\"3\" transform=\"rotate(45 770 720)\" fill=\"#fff\" stroke=\"#4a90c2\" stroke-width=\"2.5\"><\u002Frect><text x=\"770\" y=\"700\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Field Extraction<\u002Ftext><\u002Fg>\n<rect x=\"820\" y=\"556\" width=\"440\" height=\"328\" rx=\"16\" fill=\"#f4f9fb\" stroke=\"#2b6b8c\" stroke-width=\"3\"><\u002Frect>\n<text x=\"1040\" y=\"590\" fill=\"#1f5568\" font-size=\"18\" font-weight=\"800\" text-anchor=\"middle\">THE DIGITAL TWIN<\u002Ftext>\n<text x=\"1040\" y=\"610\" fill=\"#5b98a4\" font-size=\"11.5\" font-style=\"italic\" text-anchor=\"middle\">the modeled operation: every bill, meter &amp; site reconciled<\u002Ftext>\n<line x1=\"925\" y1=\"683\" x2=\"925\" y2=\"720\" stroke=\"#b9c4cf\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1040\" y1=\"683\" x2=\"1040\" y2=\"792\" stroke=\"#b9c4cf\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1155\" y1=\"683\" x2=\"1155\" y2=\"720\" stroke=\"#b9c4cf\" stroke-width=\"1.5\"><\u002Fline>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Extracted fields normalized across units, layouts, and periods into one comparable measure · the base every product reads.\" data-name=\"Normalize\" data-line=\"THE DIGITAL TWIN\"><circle cx=\"925\" cy=\"668\" r=\"8\" fill=\"#2b6b8c\"><\u002Fcircle><text x=\"925\" y=\"650\" fill=\"#3a4750\" font-size=\"11\" text-anchor=\"middle\">Normalize<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Vendor, site, tariff, and meter reconciled to one identity · the twin's spine. A record that will not reconcile is held, never published.\" data-name=\"Reconcile · Identity Resolution Layer\" data-line=\"THE DIGITAL TWIN\"><circle cx=\"1040\" cy=\"668\" r=\"8\" fill=\"#2b6b8c\"><\u002Fcircle><text x=\"1040\" y=\"650\" fill=\"#3a4750\" font-size=\"11\" text-anchor=\"middle\">Reconcile<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Consumption and cost forecasts, accrual estimates, and anomaly scores computed on the reconciled base. Applied ML · the twin's forward view.\" data-name=\"ML Forecast\" data-line=\"THE DIGITAL TWIN\"><rect x=\"1143\" y=\"656\" width=\"24\" height=\"24\" rx=\"3\" transform=\"rotate(45 1155 668)\" fill=\"#fff\" stroke=\"#4a90c2\" stroke-width=\"2.5\"><\u002Frect><text x=\"1155\" y=\"646\" fill=\"#3a4750\" font-size=\"11\" text-anchor=\"middle\">ML Forecast<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"The reconciled source of truth · 15,000+ vendors, 300+ layouts, every meter. Accuracy 99%, up from 65% before the twin. This is the moat the products are cut from.\" data-name=\"Reconciled Source of Truth\" data-line=\"THE DIGITAL TWIN\"><rect x=\"858\" y=\"792\" width=\"364\" height=\"54\" rx=\"12\" fill=\"#eef4f6\" stroke=\"#7fb3bf\" stroke-width=\"1.5\"><\u002Frect><text x=\"1040\" y=\"814\" fill=\"#2b6b8c\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">RECONCILED SOURCE OF TRUTH<\u002Ftext><text x=\"1040\" y=\"832\" fill=\"#5b98a4\" font-size=\"10\" text-anchor=\"middle\">one vendor · one site · one meter<\u002Ftext><\u002Fg>\n<text x=\"1650\" y=\"528\" fill=\"#2b6b8c\" font-size=\"13.5\" font-weight=\"800\" letter-spacing=\".5\" text-anchor=\"middle\">THE DATA MOAT: analytics no competitor can buy<\u002Ftext>\n<g id=\"ln-o1\" class=\"line-g\">\n<path d=\"M1260 720 C1360 720 1380 585 1480 585 L1900 585\" fill=\"none\" stroke=\"#2f9e4f\" stroke-width=\"8\"><\u002Fpath>\n<text x=\"1590\" y=\"562\" fill=\"#2f9e4f\" font-size=\"13\" font-weight=\"800\" letter-spacing=\".5\" text-anchor=\"middle\">BENCHMARKING · savings ranked<\u002Ftext>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Sites benchmarked against peers and their own baseline; the model ranks where the next dollar of savings sits. Applied ML.\" data-name=\"Benchmarking\" data-line=\"DATA PRODUCTS\"><rect x=\"1548\" y=\"573\" width=\"24\" height=\"24\" rx=\"3\" transform=\"rotate(45 1560 585)\" fill=\"#fff\" stroke=\"#4a90c2\" stroke-width=\"2.5\"><\u002Frect><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"The human gate: an energy manager acts on the ranked opportunities · a distributed decision, one of several, never a single chokepoint.\" data-name=\"Energy Manager Acts\" data-line=\"DATA PRODUCTS\"><circle cx=\"1900\" cy=\"585\" r=\"10\" fill=\"#fff\" stroke=\"#2f9e4f\" stroke-width=\"4\"><\u002Fcircle><text x=\"1900\" y=\"576\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Manager Acts<\u002Ftext><\u002Fg>\n<\u002Fg>\n<g id=\"ln-o2\" class=\"line-g\">\n<path d=\"M1260 720 C1360 720 1380 650 1480 650 L1900 650\" fill=\"none\" stroke=\"#8b4fd8\" stroke-width=\"8\"><\u002Fpath>\n<text x=\"1580\" y=\"628\" fill=\"#8b4fd8\" font-size=\"13\" font-weight=\"800\" letter-spacing=\".5\" text-anchor=\"middle\">FORECASTS · ACCRUALS<\u002Ftext>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Period-close accruals estimated from the twin where bills are late; a controller approves, the record locks. The human gate the design preserves on the ledger.\" data-name=\"Controller Approves\" data-line=\"DATA PRODUCTS\"><circle cx=\"1620\" cy=\"650\" r=\"10\" fill=\"#fff\" stroke=\"#8b4fd8\" stroke-width=\"4\"><\u002Fcircle><text x=\"1620\" y=\"678\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Controller<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Approved accruals and forecasts post to the ERP and planning tools · the twin decides, the ledger displays.\" data-name=\"Accruals Posted\" data-line=\"DATA PRODUCTS\"><circle cx=\"1900\" cy=\"650\" r=\"9\" fill=\"#8b4fd8\"><\u002Fcircle><text x=\"1900\" y=\"640\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Posted<\u002Ftext><\u002Fg>\n<\u002Fg>\n<g id=\"ln-byp\" class=\"line-g\">\n<path d=\"M1260 720 L1980 720\" fill=\"none\" stroke=\"#9aa4ad\" stroke-width=\"6\"><\u002Fpath>\n<text x=\"1600\" y=\"700\" fill=\"#8a95a0\" font-size=\"12.5\" font-weight=\"700\" letter-spacing=\".5\" text-anchor=\"middle\">BILL AUDIT → PAYMENT<\u002Ftext>\n<text x=\"1600\" y=\"748\" fill=\"#a7b0b8\" font-size=\"10.5\" font-style=\"italic\" text-anchor=\"middle\">the byproduct: $1B a year, but not the point<\u002Ftext>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Every charge checked against contracted tariff and expected usage; over-charges open exceptions. Runs off the same reconciled truth.\" data-name=\"Bill Audit\" data-line=\"BYPRODUCT · PAYMENT\"><circle cx=\"1500\" cy=\"720\" r=\"9\" fill=\"#9aa4ad\"><\u002Fcircle><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Approved bills post as payables and pay in multi-currency runs · $1B a year. It matters, but it is the exhaust of the data, not the product.\" data-name=\"Payment · $1B\" data-line=\"BYPRODUCT · PAYMENT\"><circle cx=\"1760\" cy=\"720\" r=\"9\" fill=\"#9aa4ad\"><\u002Fcircle><text x=\"1760\" y=\"700\" fill=\"#5f6a74\" font-size=\"11.5\" text-anchor=\"middle\">Payment<\u002Ftext><\u002Fg>\n<\u002Fg>\n<g id=\"ln-o4\" class=\"line-g\">\n<path d=\"M1260 720 C1360 720 1380 790 1480 790 L1900 790\" fill=\"none\" stroke=\"#3f9b8e\" stroke-width=\"8\"><\u002Fpath>\n<text x=\"1585\" y=\"814\" fill=\"#3f9b8e\" font-size=\"13\" font-weight=\"800\" letter-spacing=\".5\" text-anchor=\"middle\">CARBON · SCOPE 1/2<\u002Ftext>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Carbon and Scope 1/2 reporting runs as a standing feed off the same consumption base · sustainability as a side effect of design, not a project.\" data-name=\"Carbon Feed\" data-line=\"DATA PRODUCTS\"><circle cx=\"1560\" cy=\"790\" r=\"9\" fill=\"#3f9b8e\"><\u002Fcircle><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"The outcome: an audit-ready emissions report the board and regulator can read · cut from the same reconciled truth.\" data-name=\"Scope Report\" data-line=\"DATA PRODUCTS\"><circle cx=\"1900\" cy=\"790\" r=\"9\" fill=\"#3f9b8e\"><\u002Fcircle><text x=\"1900\" y=\"816\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">Report<\u002Ftext><\u002Fg>\n<\u002Fg>\n<g id=\"ln-o5\" class=\"line-g\">\n<path d=\"M1260 720 C1360 720 1380 860 1480 860 L1900 860\" fill=\"none\" stroke=\"#e8963d\" stroke-width=\"8\"><\u002Fpath>\n<text x=\"1585\" y=\"884\" fill=\"#e8963d\" font-size=\"13\" font-weight=\"800\" letter-spacing=\".5\" text-anchor=\"middle\">BUDGET vs ACTUAL<\u002Ftext>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Actuals compared to budget and accrual per site and period; variances route to the analysts who own them.\" data-name=\"Variance\" data-line=\"DATA PRODUCTS\"><circle cx=\"1560\" cy=\"860\" r=\"9\" fill=\"#e8963d\"><\u002Fcircle><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"The outcome: a variance in the hands of the owner who can act on it · and the actual that feeds back to sharpen the twin's next forecast.\" data-name=\"Variance → Owner\" data-line=\"DATA PRODUCTS\"><circle cx=\"1900\" cy=\"860\" r=\"9\" fill=\"#e8963d\"><\u002Fcircle><text x=\"1900\" y=\"886\" fill=\"#3a4750\" font-size=\"11.5\" text-anchor=\"middle\">To Owner<\u002Ftext><\u002Fg>\n<\u002Fg>\n<path d=\"M1900 650 C1980 650 1990 620 1990 560 L1990 384 C1990 360 1972 346 1948 346 L1120 346 C1104 346 1100 360 1100 384 L1100 552\" fill=\"none\" stroke=\"#c9a227\" stroke-width=\"5\" opacity=\".8\" marker-end=\"url(#mgold)\"><\u002Fpath>\n<text x=\"1560\" y=\"372\" fill=\"#a8863a\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">INTELLIGENCE LOOP · actuals &amp; outcomes sharpen the twin: a live control loop<\u002Ftext>\n<text x=\"1108\" y=\"452\" fill=\"#a8863a\" font-size=\"10\" font-style=\"italic\" text-anchor=\"start\">sharper forecasts → the twin<\u002Ftext>\n<g class=\"ov\" id=\"ov-activation\" opacity=\"0\">\n<circle cx=\"1990\" cy=\"500\" r=\"7\" fill=\"#c9a227\"><\u002Fcircle><text x=\"1974\" y=\"504\" fill=\"#a8863a\" font-size=\"11\" font-style=\"italic\" text-anchor=\"end\">actuals vs forecast<\u002Ftext>\n<circle cx=\"1700\" cy=\"346\" r=\"7\" fill=\"#c9a227\"><\u002Fcircle><text x=\"1700\" y=\"332\" fill=\"#a8863a\" font-size=\"11\" font-style=\"italic\" text-anchor=\"middle\">variance signal<\u002Ftext>\n<circle cx=\"1300\" cy=\"346\" r=\"7\" fill=\"#c9a227\"><\u002Fcircle><text x=\"1300\" y=\"332\" fill=\"#a8863a\" font-size=\"11\" font-style=\"italic\" text-anchor=\"middle\">model refit · eval gate<\u002Ftext>\n<circle cx=\"1100\" cy=\"430\" r=\"7\" fill=\"#c9a227\"><\u002Fcircle><text x=\"1086\" y=\"418\" fill=\"#a8863a\" font-size=\"11\" font-style=\"italic\" text-anchor=\"end\">forecast → twin<\u002Ftext>\n<\u002Fg>\n<g class=\"ov\" id=\"ov-exceptions\" opacity=\"0\">\n<line x1=\"900\" y1=\"884\" x2=\"900\" y2=\"336\" stroke=\"#d0392e\" stroke-width=\"2.5\" stroke-dasharray=\"8 6\" opacity=\".9\"><\u002Fline>\n<line x1=\"1180\" y1=\"884\" x2=\"1180\" y2=\"336\" stroke=\"#d0392e\" stroke-width=\"2.5\" stroke-dasharray=\"8 6\" opacity=\".9\"><\u002Fline>\n<text x=\"1040\" y=\"248\" fill=\"#d0392e\" font-size=\"12\" font-style=\"italic\" text-anchor=\"middle\">a record that will not reconcile is held, not published. Every failure is classified business, system, or model, classified in the typed error catalog<\u002Ftext>\n<\u002Fg>\n<g class=\"ov\" id=\"ov-offnet\" opacity=\"1\">\n<rect x=\"150\" y=\"986\" width=\"320\" height=\"62\" rx=\"10\" fill=\"#fdf1ef\" stroke=\"#c98d82\" stroke-dasharray=\"8 6\"><\u002Frect>\n<text x=\"166\" y=\"1010\" fill=\"#a04437\" font-size=\"11.5\" font-weight=\"800\">OUTSIDE THE PLATFORM: the residual<\u002Ftext>\n<text x=\"166\" y=\"1030\" fill=\"#a3685e\" font-size=\"10.5\">invoices no layout matches yet · spreadsheet reconciliation · the manual tail concentrates here<\u002Ftext>\n<\u002Fg>\n<defs><filter id=\"stLift\" x=\"-60%\" y=\"-60%\" width=\"220%\" height=\"220%\"><feDropShadow dx=\"0\" dy=\"0.6\" stdDeviation=\"0.9\" flood-color=\"#16324c\" flood-opacity=\"0.16\"><\u002FfeDropShadow><\u002Ffilter><filter id=\"cardLift\" x=\"-20%\" y=\"-50%\" width=\"140%\" height=\"220%\"><feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"4.5\" flood-color=\"#8a95a0\" flood-opacity=\"0.22\"><\u002FfeDropShadow><\u002Ffilter><marker id=\"mred\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#d0392e\"><\u002Fpath><\u002Fmarker><marker id=\"mgold\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#c9a227\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n<text x=\"2186\" y=\"1216\" fill=\"#a8863a\" font-size=\"13\" font-weight=\"700\" text-anchor=\"end\">THE DATA PLATFORM · every field, every meter, one moat<\u002Ftext>\n<rect x=\"70\" y=\"1660\" width=\"2140\" height=\"2\" fill=\"#16324c\"><\u002Frect>\n<g class=\"ov\" id=\"ov-receipts\" opacity=\"0\">\n<text x=\"70\" y=\"1408\" fill=\"#8a95a0\" font-size=\"13\" letter-spacing=\"1.5\" font-weight=\"700\">HOW TO READ IT<\u002Ftext>\n<text x=\"230\" y=\"1408\" fill=\"#9aa4ad\" font-size=\"12\" font-style=\"italic\">substrate identical across the three maps · only the flow changes<\u002Ftext>\n<rect x=\"70\" y=\"1420\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#5b6b7a\"><\u002Frect>\n<text x=\"96\" y=\"1432\" fill=\"#5b6b7a\" font-size=\"12.5\" font-weight=\"700\">ONTOLOGY (substrate)<\u002Ftext>\n<text x=\"330\" y=\"1432\" fill=\"#4a5560\" font-size=\"12.5\">the ground the twin is modeled on · business meaning + which system holds what · one vendor, site, and meter reconciled across the source systems<\u002Ftext>\n<rect x=\"70\" y=\"1447\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#5b6b7a\"><\u002Frect>\n<text x=\"96\" y=\"1459\" fill=\"#5b6b7a\" font-size=\"12.5\" font-weight=\"700\">TRACES (substrate)<\u002Ftext>\n<text x=\"330\" y=\"1459\" fill=\"#4a5560\" font-size=\"12.5\">every job and model action captured · the audit trail · feeds the evals · becomes the typed error catalog · the same trace layer runs all three domains<\u002Ftext>\n<rect x=\"70\" y=\"1474\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#16324c\"><\u002Frect>\n<text x=\"96\" y=\"1486\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">THE SPINE (flow)<\u002Ftext>\n<text x=\"330\" y=\"1486\" fill=\"#4a5560\" font-size=\"12.5\">EDI, portal harvest, mail/scan, and meter data land on one intake · classified and extracted against 300+ layouts · accuracy 65% → 99%<\u002Ftext>\n<rect x=\"70\" y=\"1501\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#2b6b8c\"><\u002Frect>\n<text x=\"96\" y=\"1513\" fill=\"#2b6b8c\" font-size=\"12.5\" font-weight=\"700\">THE DIGITAL TWIN (flow)<\u002Ftext>\n<text x=\"330\" y=\"1513\" fill=\"#4a5560\" font-size=\"12.5\">the modeled operation · normalize, reconcile, forecast on one reconciled base · a record that will not reconcile is held, never published<\u002Ftext>\n<rect x=\"70\" y=\"1528\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#2f9e4f\"><\u002Frect>\n<text x=\"96\" y=\"1540\" fill=\"#2f9e4f\" font-size=\"12.5\" font-weight=\"700\">DATA PRODUCTS (flow · the moat)<\u002Ftext>\n<text x=\"330\" y=\"1540\" fill=\"#4a5560\" font-size=\"12.5\">benchmarking, forecasts &amp; accruals, carbon/Scope, budget-vs-actual: cut from the reconciled truth · payment is the byproduct, not the product<\u002Ftext>\n<rect x=\"70\" y=\"1555\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#c9a227\"><\u002Frect>\n<text x=\"96\" y=\"1567\" fill=\"#a8863a\" font-size=\"12.5\" font-weight=\"700\">INTELLIGENCE LOOP (flow)<\u002Ftext>\n<text x=\"330\" y=\"1567\" fill=\"#4a5560\" font-size=\"12.5\">actuals and variances feed back through the eval gate · forecasts refit · the sharper model writes back into the twin: a live control loop<\u002Ftext>\n<\u002Fg>\n<text x=\"70\" y=\"1288\" fill=\"#5b6b7a\" font-size=\"11\" font-weight=\"700\" letter-spacing=\"2.5\">PROOF · MEASURED IN PRODUCTION<\u002Ftext>\n<rect x=\"70\" y=\"1298\" width=\"2140\" height=\"2\" fill=\"#16324c\"><\u002Frect>\n<line x1=\"70\" y1=\"1374\" x2=\"2210\" y2=\"1374\" stroke=\"#d3d8dd\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"427\" y1=\"1302\" x2=\"427\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"784\" y1=\"1302\" x2=\"784\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1140\" y1=\"1302\" x2=\"1140\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1497\" y1=\"1302\" x2=\"1497\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1853\" y1=\"1302\" x2=\"1853\" y2=\"1372\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<text x=\"88\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">15,000+<\u002Ftext><text x=\"88\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">vendors · 300+ layouts normalized<\u002Ftext>\n<text x=\"445\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">99%<\u002Ftext><text x=\"445\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">invoice accuracy, up from 65%<\u002Ftext>\n<text x=\"802\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">700K<\u002Ftext><text x=\"802\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">invoices a month, toward 1M<\u002Ftext>\n<text x=\"1158\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">$1B<\u002Ftext><text x=\"1158\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">in payments orchestrated<\u002Ftext>\n<text x=\"1515\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">30 days<\u002Ftext><text x=\"1515\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">onboarding, down from 90<\u002Ftext>\n<text x=\"1871\" y=\"1345\" fill=\"#16324c\" font-size=\"34\" font-weight=\"800\">290 → 65<\u002Ftext><text x=\"1871\" y=\"1366\" fill=\"#5f6a74\" font-size=\"11.5\">keyers reshaped to exception analysts<\u002Ftext>\n<circle cx=\"88\" cy=\"1689\" r=\"9\" fill=\"#16324c\"><\u002Fcircle><text x=\"106\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">runs autonomously<\u002Ftext>\n<circle cx=\"266\" cy=\"1689\" r=\"10\" fill=\"#fff\" stroke=\"#16324c\" stroke-width=\"4\"><\u002Fcircle><text x=\"286\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">human-in-the-loop<\u002Ftext>\n<rect x=\"452\" y=\"1679\" width=\"34\" height=\"20\" rx=\"5\" fill=\"#f4f9fb\" stroke=\"#2b6b8c\" stroke-width=\"2\"><\u002Frect><text x=\"496\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">the digital twin<\u002Ftext>\n<rect x=\"650\" y=\"1680\" width=\"34\" height=\"20\" rx=\"10\" fill=\"#eef4f6\" stroke=\"#7fb3bf\" stroke-width=\"1.5\"><\u002Frect><text x=\"694\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">reconciled truth<\u002Ftext>\n<rect x=\"852\" y=\"1679\" width=\"20\" height=\"20\" rx=\"3\" transform=\"rotate(45 862 1689)\" fill=\"#fff\" stroke=\"#4a90c2\" stroke-width=\"2.5\"><\u002Frect><text x=\"882\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">applied ML<\u002Ftext>\n<rect x=\"1016\" y=\"1683\" width=\"18\" height=\"14\" rx=\"3\" fill=\"#9aa4ad\"><\u002Frect><text x=\"1044\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">byproduct · payment<\u002Ftext>\n<line x1=\"1230\" y1=\"1689\" x2=\"1278\" y2=\"1689\" stroke=\"#c9a227\" stroke-width=\"5\"><\u002Fline><text x=\"1288\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">intelligence loop<\u002Ftext>\n<line x1=\"1450\" y1=\"1689\" x2=\"1498\" y2=\"1689\" stroke=\"#d0392e\" stroke-width=\"2.5\" stroke-dasharray=\"8 6\"><\u002Fline><text x=\"1508\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">exception feed<\u002Ftext>\n<line x1=\"1680\" y1=\"1689\" x2=\"1728\" y2=\"1689\" stroke=\"#b0483a\" stroke-width=\"3\" stroke-dasharray=\"9 7\"><\u002Fline><text x=\"1738\" y=\"1694\" fill=\"#4a5560\" font-size=\"12.5\">off-network<\u002Ftext>\n<text x=\"2210\" y=\"1682\" fill=\"#5b6b7a\" font-size=\"11\" font-weight=\"700\" letter-spacing=\"1.5\" text-anchor=\"end\">DIAGRAM 03 / 03 · UTILITY BILL MANAGEMENT: DATA PLATFORM<\u002Ftext>\n<text x=\"2210\" y=\"1699\" fill=\"#9aa4ad\" font-size=\"12\" text-anchor=\"end\">Live deployment · governed digital twin<\u002Ftext>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"maplegend\">hover any station · loop detail, exceptions, off-network and receipts light up as layers · drag to pan · <span style=\"color:var(--hum)\">the solid mark is a person acting<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n  <p class=\"closer\">Microsoft published this result.<\u002Fp>\n<\u002Fsection>\n<\u002Fdiv>\n\n<div class=\"frame\">\n<section class=\"demos\" id=\"demos\">\n  <div class=\"entry\">Human-in-the-Loop · agents on the work, people on the judgment calls<\u002Fdiv>\n  <p class=\"dintro\">Human-in-the-loop control: one checkpoint before any regulated decision ships. Two live cases. <b>Nothing releases from this page.<\u002Fb><\u002Fp>\n\n  <div class=\"gate\" id=\"gate-a\">\n    <div class=\"ghead\">\n      <div><div class=\"gtag\">Demo A · TheKey Rate-Release Review<\u002Fdiv><div class=\"gtitle\">Human-in-the-Loop Review · Rate Increase Release<\u002Fdiv><\u002Fdiv>\n      <div class=\"gbadge\">Review Required<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"gbody\">\n      <div class=\"glabel\">Proposal<\u002Fdiv>\n      <p class=\"gprop\">Release the annual rate increase: a notification letter staged for every active client agreement, rate and stage updates queued in Salesforce<\u002Fp>\n      <p class=\"gnote\">Staged straight-through. Release rights stay with a person.<\u002Fp>\n      <div class=\"glabel\">Supporting evidence<\u002Fdiv>\n      <button type=\"button\" class=\"gev\" aria-expanded=\"false\">Client Rate Table, Salesforce<\u002Fbutton>\n      <div class=\"gevnote\">Rate policy per agreement, passed.<\u002Fdiv>\n      <button type=\"button\" class=\"gev\" aria-expanded=\"false\">Notification Letter Batch<\u002Fbutton>\n      <div class=\"gevnote\">Letter template validation, passed.<\u002Fdiv>\n      <div class=\"gtwo\">\n        <div><div class=\"glabel\">Trigger reason<\u002Fdiv><div class=\"gkv\">Batch staged complete; release withheld by design<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"glabel\">Audit record<\u002Fdiv><div class=\"gkv\">Release pending approver signature<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"glabel\">Consequence if approved<\u002Fdiv>\n      <div class=\"gkv\"><b>Letters send and stages update; billing reprices on the next cycle; the release is written to the ledger<\u002Fb><\u002Fdiv>\n      <div class=\"gacts\">\n        <button type=\"button\" class=\"gbtn primary\" data-act=\"APPROVED\">Approve<\u002Fbutton>\n        <button type=\"button\" class=\"gbtn\" data-act=\"EDIT\">Edit Parameters<\u002Fbutton>\n        <button type=\"button\" class=\"gbtn\" data-act=\"ESCALATE\">Escalate<\u002Fbutton>\n        <button type=\"button\" class=\"gbtn reject\" data-act=\"REJECT\">Reject<\u002Fbutton>\n      <\u002Fdiv>\n      <p class=\"gverbs\">Approve releases and writes the record · Edit parameters reprices before release · Escalate routes to the named owner · Reject files the reason, nothing sends<\u002Fp>\n      <div class=\"gout\" role=\"status\" aria-live=\"polite\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"gate\" id=\"gate-b\" style=\"margin-top:36px\">\n    <div class=\"ghead\">\n      <div><div class=\"gtag\">Demo B · Fintech Regulatory Filing Review<\u002Fdiv><div class=\"gtitle\">Human-in-the-Loop Review · Regulatory Filing<\u002Fdiv><\u002Fdiv>\n      <div class=\"gbadge\">Review Required<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"gbody\">\n      <div class=\"glabel\">Proposal<\u002Fdiv>\n      <p class=\"gprop\">Raise the regulatory report: the case cleared the reporting threshold and the draft is assembled for the investigator<\u002Fp>\n      <p class=\"gnote\">The engine ran the three shared checks and built the case file. The filing decision is reserved for a person, by law and by design.<\u002Fp>\n      <div class=\"glabel\">Supporting evidence<\u002Fdiv>\n      <button type=\"button\" class=\"gev\" aria-expanded=\"false\">Denylist Validation Result<\u002Fbutton>\n      <div class=\"gevnote\">Denylist validation, passed.<\u002Fdiv>\n      <button type=\"button\" class=\"gev\" aria-expanded=\"false\">Event-Stream Baseline<\u002Fbutton>\n      <div class=\"gevnote\">Event-stream anomaly, confirmed.<\u002Fdiv>\n      <div class=\"gtwo\">\n        <div><div class=\"glabel\">Trigger reason<\u002Fdiv><div class=\"gkv\">Reporting threshold cleared on the shared checks; investigator decision required<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"glabel\">Audit record<\u002Fdiv><div class=\"gkv\">Case file sealed pending the filing decision<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"glabel\">Consequence if approved<\u002Fdiv>\n      <div class=\"gkv\"><b>The report files, account actions apply, and the decision trail seals for audit<\u002Fb><\u002Fdiv>\n      <div class=\"gacts\">\n        <button type=\"button\" class=\"gbtn primary\" data-act=\"APPROVED\">Approve<\u002Fbutton>\n        <button type=\"button\" class=\"gbtn\" data-act=\"EDIT\">Edit Parameters<\u002Fbutton>\n        <button type=\"button\" class=\"gbtn\" data-act=\"ESCALATE\">Escalate<\u002Fbutton>\n        <button type=\"button\" class=\"gbtn reject\" data-act=\"REJECT\">Reject<\u002Fbutton>\n      <\u002Fdiv>\n      <p class=\"gverbs\">Approve files the report and seals the chain for audit · Edit parameters regenerates the draft for a fresh filing decision · Escalate routes to the financial crimes desk · Reject records a no-file decision, the reason is kept<\u002Fp>\n      <div class=\"gout\" role=\"status\" aria-live=\"polite\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"case\" id=\"case-fintech\">\n  <div class=\"entry\">Transformation 03 · Fintech, Fraud &amp; Risk<\u002Fdiv>\n  <p class=\"scene\"><i>23:52<\u002Fi> · a case crosses the reporting threshold. The engine stops. The analyst decides.<\u002Fp>\n  <h3 class=\"lede\">An agent engine works every fraud case end to end. One analyst holds the decision.<\u002Fh3>\n  <div class=\"sir\">\n    <div class=\"sir-row\"><div class=\"k\">Situation<\u002Fdiv><div class=\"v\">Seven alert streams, seven manual programs, 6–8 disconnected systems per case.<\u002Fdiv><\u002Fdiv>\n    <div class=\"sir-row\"><div class=\"k\">Intervention<\u002Fdiv><div class=\"v\">One orchestrator, three sub-agents: evidence gathered, risk scored, case drafted across 6–8 systems. 21 steps and 12–15 screens collapse into one workspace. <span class=\"red\">Decision rights reserved: every regulated call stays with a person.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <div class=\"band\">\n    <div class=\"b1\"><div class=\"bn\">660K<\u002Fdiv><div class=\"bt\">cases a month<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn\">30–35%<\u002Fdiv><div class=\"bt\">handle time down<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn\">~$12M<\u002Fdiv><div class=\"bt\">annual benefit, CSAT up 13 points<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn red\">100%<\u002Fdiv><div class=\"bt\">of regulated decisions still go to a human<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"decs\">\n    <div class=\"dec\"><b>One engine:<\u002Fb> seven manual programs → one agent engine.<\u002Fdiv>\n    <div class=\"dec\"><b>Three checks:<\u002Fb> owned once, inherited by every line of business.<\u002Fdiv>\n    <div class=\"dec\"><b>Sequence:<\u002Fb> denial parameters evaluate first. First-pass yield over rework.<\u002Fdiv>\n    <div class=\"dec\"><b>Rollout:<\u002Fb> India to LATAM without a rebuild; EMEA now in design under the EU AI Act.<\u002Fdiv>\n  <\u002Fdiv>\n\n<div class=\"mapshell rv\">\n<div class=\"maphost\" data-map=\"fintech\">\n<button class=\"fsbtn\" type=\"button\" aria-label=\"View engine diagram full screen\">⛶ Full screen<\u002Fbutton>\n<div class=\"avm2-root\" id=\"avm2-fin\">\n<div class=\"bar\">\n<span class=\"hint\"><b>Hover any node<\u002Fb> for the detail · the resting state stays calm.<\u002Fspan>\n<div class=\"avm-grp\">\n<button class=\"avm-tgl\" type=\"button\" data-ov=\"loop\" aria-pressed=\"false\">Learning loop<\u002Fbutton>\n<\u002Fdiv>\n<span class=\"avm-spacer\"><\u002Fspan>\n<button class=\"print\" type=\"button\" id=\"printBtn-fin\">Print<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"avm-svgscroll\">\n<div id=\"tip-fin\" class=\"map-tip\" role=\"status\"><\u002Fdiv>\n<svg id=\"map-fin\" viewBox=\"0 252 1600 462\" xmlns=\"http://www.w3.org/2000/svg\" role=\"group\" aria-label=\"Fraud and risk agent engine map\">\n<rect width=\"1600\" height=\"990\" fill=\"#fff\"><\u002Frect>\n\n<!-- MASTHEAD -->\n<rect x=\"100\" y=\"46\" width=\"30\" height=\"22\" rx=\"2\" fill=\"#16324c\"><\u002Frect><text class=\"disp\" x=\"115\" y=\"63\" fill=\"#fff\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\">01<\u002Ftext>\n<text class=\"disp\" x=\"144\" y=\"62\" fill=\"#5b6b7a\" font-size=\"11.5\" font-weight=\"600\" letter-spacing=\"2.4\">AGENTIC ORCHESTRATION OF FRAUD &amp; RISK · FINTECH<\u002Ftext>\n<text class=\"disp\" x=\"1500\" y=\"62\" fill=\"#9aa4ad\" font-size=\"11.5\" font-weight=\"600\" letter-spacing=\"2\" text-anchor=\"end\">DIAGRAM 01 / 03<\u002Ftext>\n<text class=\"disp\" x=\"100\" y=\"114\" fill=\"#16324c\" font-size=\"40\" font-weight=\"700\" letter-spacing=\"-1\">The engine that works the case.<\u002Ftext>\n<text x=\"100\" y=\"142\" fill=\"#3a4750\" font-size=\"15\">An agent engine works every case end to end: every check, every citation. Every alert funnels in; every regulated decision funnels through one person.<\u002Ftext>\n<rect x=\"100\" y=\"158\" width=\"1400\" height=\"2\" fill=\"#16324c\"><\u002Frect>\n\n<!-- SUBSTRATE · thin rules, not bands -->\n<line x1=\"100\" y1=\"252\" x2=\"1500\" y2=\"252\" stroke=\"#dfe3e7\" stroke-width=\"1.5\"><\u002Fline>\n<text class=\"disp\" x=\"100\" y=\"244\" fill=\"#5b6b7a\" font-size=\"10.5\" font-weight=\"600\" letter-spacing=\"1.8\">EXECUTION TRACES · OBSERVABILITY<\u002Ftext>\n<text x=\"1500\" y=\"244\" fill=\"#aab2ba\" font-size=\"10.5\" text-anchor=\"end\">every agent action captured: the audit trail<\u002Ftext>\n<line x1=\"100\" y1=\"688\" x2=\"1500\" y2=\"688\" stroke=\"#dfe3e7\" stroke-width=\"1.5\"><\u002Fline>\n<text class=\"disp\" x=\"100\" y=\"706\" fill=\"#5b6b7a\" font-size=\"10.5\" font-weight=\"600\" letter-spacing=\"1.8\">ONTOLOGY · THE GROUND THE AGENTS REASON ON<\u002Ftext>\n<text x=\"1500\" y=\"706\" fill=\"#aab2ba\" font-size=\"10.5\" text-anchor=\"end\">one customer reconciled across 8 systems<\u002Ftext>\n\n<!-- COLUMN LABELS -->\n<text class=\"disp\" x=\"100\" y=\"300\" fill=\"#8a95a0\" font-size=\"10.5\" font-weight=\"600\" letter-spacing=\"1.8\">INTAKE: 7 ALERT STREAMS<\u002Ftext>\n<text class=\"disp\" x=\"520\" y=\"300\" fill=\"#16324c\" font-size=\"14\" font-weight=\"700\">AGENT ENGINE<\u002Ftext>\n<text x=\"520\" y=\"318\" fill=\"#8a95a0\" font-size=\"11\">orchestrator + three sub-agents over shared state ored on device and behaviour.\" data-name=\"Account Takeover\" data-line=\"INTAKE\"><rect x=\"100\" y=\"415\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#2f9e4f\"><\u002Frect><text x=\"122\" y=\"425\" fill=\"#3a4750\" font-size=\"12\">Account Takeover<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Authorized-push-payment and scam reports · victim-initiated transfers that clear checks but fail intent.\" data-name=\"Scams · APP Fraud\" data-line=\"INTAKE\"><rect x=\"100\" y=\"461\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#3b76d0\"><\u002Frect><text x=\"122\" y=\"471\" fill=\"#3a4750\" font-size=\"12\">Scams · APP Fraud<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Transaction-monitoring and sanctions-screening hits · the regulated stream, always a person on the decision.\" data-name=\"AML &amp; Sanctions\" data-line=\"INTAKE\"><rect x=\"100\" y=\"507\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#8b4fd8\"><\u002Frect><text x=\"122\" y=\"517\" fill=\"#3a4750\" font-size=\"12\">AML &amp; Sanctions<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Chargeback and dispute intake · reason-coded, deduplicated, reconciled to an existing case where one exists.\" data-name=\"Disputes\" data-line=\"INTAKE\"><rect x=\"100\" y=\"553\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#3f9b8e\"><\u002Frect><text x=\"122\" y=\"563\" fill=\"#3a4750\" font-size=\"12\">Disputes<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Onboarding and credit-risk review · identity, first-party risk, and synthetic-identity signals at the front door.\" data-name=\"Credit &amp; KYC Risk\" data-line=\"INTAKE\"><rect x=\"100\" y=\"599\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#b6603a\"><\u002Frect><text x=\"122\" y=\"609\" fill=\"#3a4750\" font-size=\"12\">Credit &amp; KYC Risk<\u002Ftext><\u002Fg>\n<circle cx=\"360\" cy=\"468\" r=\"7\" fill=\"#16324c\"><\u002Fcircle>\n<text x=\"360\" y=\"502\" fill=\"#8a95a0\" font-size=\"10.5\" text-anchor=\"middle\">every alert · one intake<\u002Ftext>\n\n<!-- ENGINE NODES on the spine (no container) -->\n<g class=\"station\" tabindex=\"0\" data-tip=\"One orchestrator plans the case, calls the sub-agents in order, and holds the state they share · the spine every case runs on.\" data-name=\"Orchestrator\" data-line=\"AGENT ENGINE\"><rect x=\"547\" y=\"455\" width=\"26\" height=\"26\" transform=\"rotate(45 560 468)\" fill=\"#16324c\"><\u002Frect><text x=\"560\" y=\"438\" fill=\"#3a4750\" font-size=\"11\" text-anchor=\"middle\">Orchestrator<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Gathers evidence from the case's systems · transactions, KYC, device, prior cases · into shared state. The ontology tells it which system holds what.\" data-name=\"Ingestion\" data-line=\"AGENT ENGINE\"><rect x=\"659\" y=\"457\" width=\"22\" height=\"22\" fill=\"#16324c\"><\u002Frect><text x=\"670\" y=\"438\" fill=\"#3a4750\" font-size=\"11\" text-anchor=\"middle\">Ingestion<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Reasons over the assembled evidence and the risk score to a finding · with citations back to the source records.\" data-name=\"Investigation\" data-line=\"AGENT ENGINE\"><rect x=\"769\" y=\"457\" width=\"22\" height=\"22\" fill=\"#16324c\"><\u002Frect><text x=\"780\" y=\"438\" fill=\"#3a4750\" font-size=\"11\" text-anchor=\"middle\">Investigation<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Drafts the case summary and, where reportable, the SAR narrative · grounded in the evidence, never free-written.\" data-name=\"Reporting\" data-line=\"AGENT ENGINE\"><rect x=\"879\" y=\"457\" width=\"22\" height=\"22\" fill=\"#16324c\"><\u002Frect><text x=\"890\" y=\"438\" fill=\"#3a4750\" font-size=\"11\" text-anchor=\"middle\">Reporting<\u002Ftext><\u002Fg>\n<line x1=\"548\" y1=\"508\" x2=\"900\" y2=\"508\" stroke=\"#c9ccd0\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"560\" y1=\"486\" x2=\"5  r=\"8\" fill=\"#fff\" stroke=\"#16324c\" stroke-width=\"3\"><\u002Fcircle><text x=\"1400\" y=\"544\" fill=\"#3a4750\" font-size=\"12\" text-anchor=\"middle\">Outcome → labels<\u002Ftext><\u002Fg>\n\n<!-- MODEL LOOP · tight learning arc contained in the engine waist -->\n<g class=\"ov\" id=\"ov2-loop\" opacity=\"0\">\n<path d=\"M992 491 C930 522 895 508 853 508\" fill=\"none\" stroke=\"#b8912f\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" opacity=\".95\" marker-end=\"url(#mg)\"><\u002Fpath>\n<text x=\"915\" y=\"556\" fill=\"#a8863a\" font-size=\"10\" text-anchor=\"middle\">LEARNING LOOP · outcomes retrain the scorer<\u002Ftext>\n<\u002Fg>\n\n<!-- PROOF -->\n<text class=\"disp\" x=\"100\" y=\"790\" fill=\"#5b6b7a\" font-size=\"10.5\" font-weight=\"600\" letter-spacing=\"2.2\">PROOF · MEASURED IN PRODUCTION<\u002Ftext>\n<rect x=\"100\" y=\"800\" width=\"1400\" height=\"2\" fill=\"#16324c\"><\u002Frect>\n<line x1=\"100\" y1=\"874\" x2=\"1500\" y2=\"874\" stroke=\"#dfe3e7\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"450\" y1=\"804\" x2=\"450\" y2=\"872\" stroke=\"#e6e9ec\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"800\" y1=\"804\" x2=\"800\" y2=\"872\" stroke=\"#e6e9ec\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1150\" y1=\"804\" x2=\"1150\" y2=\"872\" stroke=\"#e6e9ec\" stroke-width=\"1.5\"><\u002Fline>\n<text class=\"disp\" x=\"118\" y=\"846\" fill=\"#16324c\" font-size=\"38\" font-weight=\"700\">660K<\u002Ftext><text x=\"118\" y=\"867\" fill=\"#5f6a74\" font-size=\"11.5\">cases handled a month<\u002Ftext>\n<text class=\"disp\" x=\"468\" y=\"846\" fill=\"#16324c\" font-size=\"38\" font-weight=\"700\">30–35%<\u002Ftext><text x=\"468\" y=\"867\" fill=\"#5f6a74\" font-size=\"11.5\">average handle time reduced<\u002Ftext>\n<text class=\"disp\" x=\"818\" y=\"846\" fill=\"#16324c\" font-size=\"38\" font-weight=\"700\">100%<\u002Ftext><text x=\"818\" y=\"867\" fill=\"#5f6a74\" font-size=\"11.5\">regulated decisions with a human<\u002Ftext>\n<text class=\"disp\" x=\"1168\" y=\"846\" fill=\"#16324c\" font-size=\"38\" font-weight=\"700\">~$12M<\u002Ftext><text x=\"1168\" y=\"867\" fill=\"#5f6a74\" font-size=\"11.5\">annual benefit · ROI<\u002Ftext>\n\n<!-- FOOTER -->\n<rect x=\"100\" y=\"914\" width=\"1400\" height=\"2\" fill=\"#16324c\"><\u002Frect>\n<circle cx=\"108\" cy=\"946\" r=\"7\" fill=\"#16324c\"><\u002Fcircle><text x=\"124\" y=\"950\" fill=\"#5f6a74\" font-size=\"11\">runs autonomously<\u002Ftext>\n<circle cx=\"270\" cy=\"946\" r=\"8\" fill=\"#fff\" stroke=\"#c8102e\" stroke-width=\"3.5\"><\u002Fcircle><text x=\"286\" y=\"950\" fill=\"#5f6a74\" font-size=\"11\">human decides<\u002Ftext>\n<rect x=\"405\" y=\"939\" width=\"14\" height=\"14\" transform=\"rotate(45 412 946)\" fill=\"#16324c\"><\u002Frect><text x=\"428\" y=\"950\" fill=\"#5f6a74\" font-size=\"11\">orchestrator<\u002Ftext>\n<rect x=\"545\" y=\"939\" width=\"14\" height=\"14\" fill=\"#16324c\"><\u002Frect><text x=\"566\" y=\"950\" fill=\"#5f6a74\" font-size=\"11\">sub-agent<\u002Ftext>\n<rect x=\"700\" y=\"939\" width=\"14\" height=\"14\" fill=\"#fff\" stroke=\"#16324c\" stroke-width=\"2\"><\u002Frect><text x=\"721\" y=\"950\" fill=\"#5f6a74\" font-size=\"11\">applied ML<\u002Ftext>\n<text class=\"disp\" x=\"1500\" y=\"940\" fill=\"#5b6b7a\" font-size=\"10.5\" font-weight=\"600\" letter-spacing=\"1.4\" text-anchor=\"end\">DIAGRAM 01 / 03 · FRAUD &amp; RISK · FINTECH<\u002Ftext>\n<text x=\"1500\" y=\"957\" fill=\"#9aa4ad\" font-size=\"11\" text-anchor=\"end\">Live deployment · agentic orchestration of fraud &amp; risk<\u002Ftext>\n\n<defs><marker id=\"mg\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4.5\" markerHeight=\"4.5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#b8912f\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"maplegend\">hover any node · the button reveals the learning loop · the heavy ring is the analyst · <span style=\"color:var(--hum)\">the solid mark is a person acting<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n  <p class=\"fine\">The same five blocks run under every stream; a person holds only the exceptions.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"case\" id=\"case-bank\">\n  <div class=\"entry\">Transformation 04 · Global Bank<\u002Fdiv>\n  <p class=\"scene\"><i>Day 5<\u002Fi> · 62 touchpoints on the table. Three survive.<\u002Fp>\n  <h3 class=\"lede\">One target operating model for eight fraud journeys.<\u002Fh3>\n  <div class=\"sir\">\n    <div class=\"sir-row\"><div class=\"k\">Situation<\u002Fdiv><div class=\"v\">188 FTE · 40 systems · eight fraud case types · 62 separate touchpoints.<\u002Fdiv><\u002Fdiv>\n    <div class=\"sir-row\"><div class=\"k\">Intervention<\u002Fdiv><div class=\"v\">Five-day discovery sprint → operating-model redesign: <b>62 touchpoints to 3 intervention points.<\u002Fb> ~20 applications into one case view; 20+ post-decision actions automated per outcome.<\u002Fdiv><\u002Fdiv>\n    <div class=\"sir-row\"><div class=\"k\">The tiered model<\u002Fdiv><div class=\"v\">2.48M fraud calls a year in three tiers: automated · agent-assisted · <span class=\"red\">human only, reserved for romance scams, high-loss cases, and vulnerable customers.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"sir-row\"><div class=\"k\">Result<\u002Fdiv><div class=\"v\">In production. <b>The bank brought the practice back to design what comes next.<\u002Fb><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"closer\">The bank runs on the model I designed.<\u002Fp>\n  <p class=\"fine\">The method travels to whatever platform a client already runs.<\u002Fp>\n<\u002Fsection>\n\n<div class=\"mastsheet\"><div class=\"entry\" style=\"justify-content:center\">Act IV · The Operator<\u002Fdiv><div class=\"paper\" style=\"margin-top:14px\">THE PRACTICE<\u002Fdiv><div class=\"dateline\">Azhar Khan · Home care · Utilities · Fraud · Banking · 2016–2026<\u002Fdiv><\u002Fdiv>\n<div class=\"journey rv\" id=\"journey\">\n  <div class=\"maphead\"><div class=\"maptitle\">The engagement, end to end<\u002Fdiv><div class=\"fieldhint\">see it · weigh it · model it · redesign it · run it<\u002Fdiv><\u002Fdiv>\n  <svg id=\"jmap\" viewBox=\"0 0 1180 250\" role=\"img\" aria-label=\"Five-stage engagement: see the process as it runs, weigh value against feasibility, model the twin, redesign on it, run it in production.\"><\u002Fsvg>\n  <p class=\"jcap\" id=\"jcap\"><\u002Fp>\n  <div class=\"jdots\" id=\"jdots\" role=\"tablist\" aria-label=\"Engagement stages\"><\u002Fdiv>\n<\u002Fdiv>\n<section class=\"standing\" id=\"standing\">\n  <div class=\"entry\">Who's Making the Call · Azhar Khan<\u002Fdiv>\n  <h3 class=\"slede\">Operator, not architect.<\u002Fh3>\n  <p class=\"sbody\">Since 2016: RPA, then intelligent automation, now agents. The discipline never changed: see the real process, weigh it, model it, redesign it against the model, run it. <b>The client's own people hold every decision that carries risk.<\u002Fb><\u002Fp>\n  <div class=\"creds\">Microsoft-published case study · Forrester recognition (2021) · UiPath AI10 Award · Patented product (BotScope)<\u002Fdiv>\n<\u002Fsection>\n<section class=\"arc\" id=\"arc\">\n  <div class=\"entry\">2016 to 2026 · Azhar Khan<\u002Fdiv>\n  <h3 class=\"slede\">Three technology generations. One operating discipline.<\u002Fh3>\n  <div class=\"sir\" style=\"margin-top:30px\">\n    <div class=\"arcrow\"><div class=\"k\">2016–2019 · RPA<\u002Fdiv><div class=\"v\">Enterprise automation at scale: CoE design at a top US telecom · 250-automation program at a Fortune 50 · AP cycle time 90 days → 2 at a Fortune 500.<\u002Fdiv><\u002Fdiv>\n    <div class=\"arcrow\"><div class=\"k\">2019–2021 · Intelligent automation<\u002Fdiv><div class=\"v\">Governance and observability productized as BotScope (patented, Forrester-recognized) before the market had a word for AgentOps.<\u002Fdiv><\u002Fdiv>\n    <div class=\"arcrow\"><div class=\"k\">2021–2026 · Agentic operations<\u002Fdiv><div class=\"v\">Governed agentic operations in production · the four engagements on this page.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"record\" id=\"record\">\n  <div class=\"entry\">The Full Record · Azhar Khan<\u002Fdiv>\n  <p class=\"rintro\">Ten years in production: RPA → intelligent automation → agentic. $100M+ delivered.<\u002Fp>\n  <div class=\"rrows\">\n    <div class=\"rrow\">CoE design, a top US telecom, 2016 to 2019.<\u002Fdiv>\n    <div class=\"rrow\">250-automation program, a Fortune 50, 2016 to 2019.<\u002Fdiv>\n    <div class=\"rrow\">70+ automations, a Fortune 20, 2016 to 2019.<\u002Fdiv>\n    <div class=\"rrow\">AP cycle time cut from 90 days to 2, a Fortune 500, 2016 to 2019.<\u002Fdiv>\n    <div class=\"rrow\">BotScope, patented, Forrester-recognized, 2019 to 2021.<\u002Fdiv>\n    <div class=\"rrow\">TheKey, national home care, 170M tasks a year, $30M+ measured impact since 2021.<\u002Fdiv>\n    <div class=\"rrow\">EMS, utility bill management, more than $1B a year in payments orchestrated, Microsoft-published.<\u002Fdiv>\n    <div class=\"rrow\">Fintech, fraud &amp; risk, 660K cases a month, approximately $12M annual benefit.<\u002Fdiv>\n    <div class=\"rrow\">Global bank, fraud &amp; risk, 62 touchpoints cut to 3, in production.<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"rsum\">Every program above is checkable against a number and a date.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"contact\" id=\"contact\">\n  <div class=\"entry\">Contact · Azhar Khan<\u002Fdiv>\n  <h3 class=\"cline\">Operating model first. Agents second. <span class=\"red\">A person holds every decision that carries risk.<\u002Fspan><\u002Fh3>\n  <p class=\"closer\" style=\"max-width:44ch\">In 2026 the market found names for this: paved paths. Systems thinking. Governed autonomy. <b style=\"color:var(--hum)\">It’s been running in production since 2021.<\u002Fb><\u002Fp>\n  <div class=\"cfoot\">\n    <div>\n      <a class=\"cta\" href=\"mailto:ap.applyy@gmail.com?subject=Executive%20Conversation%20-%20Azhar%20Khan\">Email Azhar Khan directly<\u002Fa>\n      <div class=\"cmail\" style=\"margin-top:14px\">ap.applyy@gmail.com<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cmail\">Microsoft-published case study · Forrester recognition (2021)<br>UiPath AI10 Award · Patented product (BotScope)<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fmain>\n\n<script>\n(function(){\n  'use strict';\n  /* fields */\n  var css=getComputedStyle(document.documentElement);\n  function tone(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}\n  function draw(){\n    var g1=document.getElementById('cells1');\n    if(!g1) return; /* Act I poster replaced the hero fields; drawn artifacts repaint elsewhere */\n    var reds1=[[7,4],[23,17],[41,9],[58,21],[66,3],[74,14],[88,7],[95,19],[15,23]];\n    var s='';\n    for(var x=0;x<100;x++)for(var y=0;y<25;y++){\n      var r=reds1.some(function(p){return p[0]===x&&p[1]===y});\n      s+='<rect x=\"'+(x*3.4+.4)+'\" y=\"'+(y*4.5+.4)+'\" width=\"2.4\" height=\"3.4\" fill=\"'+(r?tone('--hum'):tone('--rule'))+'\"/>';\n    }\n    g1.innerHTML=s;\n    var g2=document.getElementById('cells2'); s='';\n    for(var i=0;i<100;i++){\n      var x=i%20,y=Math.floor(i/20),r=(i===37);\n      s+='<circle cx=\"'+(x*17+9)+'\" cy=\"'+(y*22+12)+'\" r=\"'+(r?6:4.2)+'\" fill=\"'+(r?tone('--hum'):tone('--rule'))+'\"/>';\n    }\n    g2.innerHTML=s;\n    var g3=document.getElementById('cells3'); s='';\n    for(var i=0;i<129;i++){\n      var t=i/129, col=Math.floor(i/11), row=i%11;\n      var x=14+col*22, y=10+row*9.2+(col%2)*3;\n      s+='<rect x=\"'+x+'\" y=\"'+y+'\" width=\"3.4\" height=\"3.4\" fill=\"'+tone('--ink-3')+'\" opacity=\"'+(0.35+0.5*t)+'\"/>';\n    }\n    s+='<rect x=\"318\" y=\"48\" width=\"14\" height=\"14\" fill=\"'+tone('--hum')+'\" transform=\"rotate(45 325 55)\"/>';\n    g3.innerHTML=s;\n  }\n  draw();\n  /* theme */\n  var tt=document.getElementById(' der the investigator’s name'],['Account','Actions apply per the decision'],['Chain','Evidence and decision seal for audit']]},\n    EDIT:{h:'PARAMETERS OPEN FOR EDIT',rows:[['Narrative window','The activity period the report covers'],['Included activity','The transactions attached to the filing'],['Attachments','Documents and verification results included'],['On save','The draft regenerates for a fresh filing decision']]},\n    ESCALATE:{h:'ESCALATED · CASE SEALED',rows:[['Raised to','The financial crimes desk'],['Attached','The full case file and both check results'],['While open','The clock is encoded; the case stays sealed']]},\n    REJECT:{h:'NO-FILE DECISION RECORDED',rows:[['Reason required','Below threshold on review · baseline false positive · duplicate case'],['Record','Declining to file is itself a filed decision; the reason is kept'],['Feedback','The reason sharpens the shared checks for the next case']]}\n  };\n  function wire(id,OUT){\n    var root=document.getElementById(id);\n    var out=root.querySelector('.gout');\n    Array.prototype.forEach.call(root.querySelectorAll('.gbtn[data-act]'),function(b){\n      b.addEventListener('click',function(){\n        var o=OUT[b.getAttribute('data-act')];\n        var btns=root.querySelectorAll('.gbtn[data-act]');\n        Array.prototype.forEach.call(btns,function(x){x.disabled=true;x.style.opacity=.45});\n        out.innerHTML='<div class=\"gpend\"><i><\u002Fi>Writing to the audit ledger<\u002Fdiv>'; out.classList.add('on');\n        setTimeout(function(){\n          var h='<div class=\"oh\">'+o.h+'<\u002Fdiv>';\n          o.rows.forEach(function(r,ri){h+='<div class=\"orow\" style=\"animation-delay:'+(ri*110)+'ms\"><div class=\"k\">'+r[0]+'<\u002Fdiv><div class=\"v\">'+r[1]+'<\u002Fdiv><\u002Fdiv>'});\n          h+='<p class=\"otoast\" style=\"animation:orowIn .4s ease '+(o.rows.length*110)+'ms forwards;opacity:0\">The platform logs the decision and the reason behind it.<\u002Fp>';\n          h+='<button type tAngle=rng()*Math.PI*2;restRadius=34+rng()*26;\n          x=cx+R*Math.cos(orbitPhase);y=cy+R*Math.sin(orbitPhase);\n        }\n        particles.push({x:x,y:y,jx:jx,jy:jy,restAngle:restAngle,restRadius:restRadius,orbitPhase:orbitPhase,orbitSpeed:0.35+rng()*0.15,pauseOffset:rng()*6,qt:i/pcount,type:isExc?'exception':'normal'});\n      }\n    }\n    function size(){\n      var r=wrap.getBoundingClientRect();dpr=window.devicePixelRatio||1;\n      W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));\n      canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);\n      ctx.setTransform(dpr,0,0,dpr,0,0);initParticles();\n    }\n    function drawParticle(p){\n      if(p.type==='exception'){\n        ctx.fillStyle=tone('--hum');\n        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);ctx.fillRect(-4,-4,8,8);ctx.restore();\n      }else{\n        ctx.fillStyle=tone('--ink-3');\n        ctx.fillRect(p.x-1.6,p.y-1.6,3.2,3.2);\n      }\n    }\n    function drawManual(cx,cy){\n      ctx.clearRect(0,0,W,H);\n      ctx.beginPath();ctx.arc(cx,cy,30,0,Math.PI*2);\n      ctx.fillStyle=tone('--hum');ctx.globalAlpha=0.14;ctx.fill();ctx.globalAlpha=1;\n      ctx.lineWidth=1.5;ctx.strokeStyle=tone('--hum');ctx.stroke();\n      particles.forEach(function(p){\n        var tx=cx+p.restRadius*Math.cos(p.restAngle),ty=cy+p.restRadius*Math.sin(p.restAngle);\n        p.x+=(tx-p.x)*0.035;p.y+=(ty-p.y)*0.035;\n        if(p.type!=='exception'&&p.qt>0.72){\n          ctx.fillStyle=tone('--hum');ctx.globalAlpha=0.35+0.6*(p.qt-0.72)/0.28;\n          ctx.fillRect(p.x-1.8,p.y-1.8,3.6,3.6);ctx.globalAlpha=1;\n        } else drawParticle(p);\n      });\n    }\n    function drawAgentic(cx,cy){\n      ctx.clearRect(0,0,W,H);\n      var R=Math.min(W,H)*0.42;\n      ctx.beginPath();ctx.arc(cx,cy,R*0.24,0,Math.PI*2);\n      ctx.fillStyle=tone('--sys');ctx.globalAlpha=0.10;ctx.fill();ctx.globalAlpha=1;\n      ctx.lineWidth=1.5;ctx.strokeStyle=tone('--sys');ctx.stroke();\n      particles.forEach(function(p){\n        var paused=false;\n        if(p.type==='exception'){var cyc=(t*0.001+p.pauseOffset)%6;paused=cyc<1.4;}\n        if(!paused)p.orbitPhase+=p.orbitSpeed*0.012;\n        var ringR=(p.type==='exception'&&paused)?R*0.24:R;\n        var tx=cx+ringR*Math.cos(p.orbitPhase),ty=cy+ringR*Math.sin(p.orbitPhase);\n        p.x+=(tx-p.x)*0.08;p.y+=(ty-p.y)*0.08;\n      });\n      var lineColor=tone('--ink-3'),cell=70,grid={};\n      particles.forEach(function(p){var gx=Math.floor(p.x/cell),gy=Math.floor(p.y/cell),k=gx+'_'+gy;(grid[k]||(grid[k]=[])).push(p);});\n      particles.forEach(function(p){\n        var gx=Math.floor(p.x/cell),gy=Math.floor(p.y/cell);\n        for(var ox=-1;ox<=1;ox++)for(var oy=-1;oy<=1;oy++){\n          var neigh=grid[(gx+ox)+'_'+(gy+oy)];if(!neigh)continue;\n          for(var j=0;j<neigh.length;j++){\n            var q=neigh[j];if(q===p)continue;\n            var dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);\n            if(d<50){ctx.strokeStyle=lineColor;ctx.globalAlpha=Math.max(0,0.22-d/230);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.globalAlpha=1;}\n          }\n        }\n      });\n      particles.forEach(drawParticle);\n    }\n    function frame(ts){t=ts;var cx=W/2,cy=H/2;if(mode==='manual')drawManual(cx,cy);else drawAgentic(cx,cy);raf=requestAnimationFrame(frame);}\n    function startCounter(){\n      if(!readoutEl||tickTimer)return;\n      tickTimer=setInterval(function(){count++;readoutEl.textContent=String(count);},mode==='manual'?420:190);\n    }\n    function stopCounter(){if(tickTimer){clearInterval(tickTimer);tickTimer=null;}}\n    function start(){if(running||RM2)return;running=true;raf=requestAnimationFrame(frame);startCounter();}\n    function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;stopCounter();}\n    function paintStatic(){\n      var cx=W/2,cy=H/2;\n      if(mode==='manual'){particles.forEach(function(p){p.x=cx+p.restRadius*Math.cos(p.restAn
