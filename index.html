  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 i{color:#E8744B;font-style:normal}\n.fline .c{display:none}\n.fline.cur .c{display:inline-block;width:8px;height:13px;background:#E8744B;vertical-align:-1px;margin-left:6px;animation:blink 1s steps(2) infinite}\n@keyframes blink{50%{opacity:0}}\n.breakhead{font-size:clamp(30px,4.6vw,46px);color:#EFEAD8;font-weight:800;letter-spacing:-.02em;line-height:1.08;margin:28px auto 10px;max-width:18ch;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}\n.breakhead{opacity:1;transform:none}\n.breakhead .w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);\n  transition:opacity .28s cubic-bezier(.16,1,.3,1),transform .28s cubic-bezier(.16,1,.3,1),filter .28s cubic-bezier(.16,1,.3,1)}\n.breakhead.on .w{opacity:1;transform:none;filter:none}\n.breaksub{font-size:20px;color:#E8744B;font-weight:700;opacity:0;transition:opacity .5s .1s}\n.breaksub.on{opacity:1}\n.shift-actions.pending{opacity:0;pointer-events:none}\n.shift-actions.armed{opacity:1;pointer-events:auto;transition:opacity .5s}\n@media (prefers-reduced-motion: reduce){.shift-grid i.red{animation:none}}\n@media print{.shift{display:none !important}}\n\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header><div class=\"frame mast\">\n  <div class=\"name\" style=\"color:var(--dwhite)\">Azhar Khan<\u002Fdiv>\n  <div class=\"runhead\" id=\"runhead\" aria-hidden=\"true\"><\u002Fdiv>\n  <nav>\n    <a href=\"#work\">Method<\u002Fa><a href=\"#demos\">Demos<\u002Fa><a href=\"#contact\">Contact<\u002Fa>\n    \n    <button id=\"pdf\" type=\"button\" aria-label=\"Print or save as PDF\">PDF<\u002Fbutton>\n  <\u002Fnav>\n<div class=\"readline\" id=\"readline\" aria-hidden=\"true\"><\u002Fdiv><\u002Fdiv><\u002Fheader>\n\n<main>\n<div class=\"frame\">\n<section class=\"hero\" id=\"top\">\n  <div class=\"entry\" style=\"color:var(--haze)\">Governed autonomy · in production<\u002Fdiv>\n  <h1 style=\"color:var(--dwhite)\">I let <s style=\"color:var(--haze);text-decoration:line-through;text-decoration-color:var(--dwhite);text-decoration-thickness:3px\">bots<\u002Fs> agents handle the boring details of the business.<\u002Fh1>\n  <p class=\"sub\" style=\"color:var(--dsilver);font:500 14px/1.7 var(--mono);margin:22px 0 0;max-width:52ch\">Governed autonomy, run across three generations of digital workforce. <b style=\"color:var(--dwhite)\">The tools changed three times. The system didn't.<\u002Fb><\u002Fp>\n  <div id=\"proof\" style=\"margin-top:52px\">\n    <div class=\"prow beat\"><div class=\"n\"><span class=\"mark\"><\u002Fspan>9<span>/10,000<\u002Fspan><\u002Fdiv><div class=\"d\">home care jobs close themselves · <em>a person<\u002Fem> takes 9 · 99.91% straight-through<\u002Fdiv><\u002Fdiv>\n    <div class=\"prow beat\"><div class=\"n\"><span class=\"mark\"><\u002Fspan>1<span>/100<\u002Fspan><\u002Fdiv><div class=\"d\">below the confidence threshold · <em>held for a person<\u002Fem> · the exception trains the system<\u002Fdiv><\u002Fdiv>\n    <div class=\"prow beat\"><div class=\"n\"><span class=\"mark\"><\u002Fspan>129<span>→1<\u002Fspan><\u002Fdiv><div class=\"d\">signals assembled per case · <em>one decision<\u002Fem> · an analyst's, by law<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"pthesis\" style=\"color:var(--dsilver)\">One governed control plane for enterprise operations: <span style=\"color:var(--dfog)\">deterministic rails, non-deterministic agents, the same guardrails.<\u002Fspan> <b style=\"color:var(--dwhite)\">Judgment stays with people.<\u002Fb><\u002Fp>\n<\u002Fsection>\n<\u002Fdiv>\n\n<section class=\"pivot\" id=\"floor\" style=\"margin-top:72px;padding:64px 0 72px\">\n<div class=\"frame\">\n  <div class=\"entry\" style=\"color:#8FA294\">The Argument · enterprise readiness is agentic readiness<\u002Fdiv>\n  <div class=\"status\" style=\"margin-top:26px\"><span>SHIFT · <i>23:52<\u002Fi> · FLOOR LIVE<\u002Fspan><span>OPERATOR: <i>YOU<\u002Fi><\u002Fspan><\u002Fdiv>\n  <h2 class=\"typed\">Most enterprises aren't agent-ready. <s>Deploying agents into that<\u002Fs> <em>makes the chaos faster.<\u002Fem><span class=\"cur\"><\u002Fspan><\u002Fh2>\n  <p class=\"quiet\" style=\"margin-top:14px;max-width:60ch\">Disconnected systems. No golden record. No decision rights. No exception paths. <b style=\"color:#EFEAD8\">Agents are only as good as the data underneath them<\u002Fb> · the fix isn't a better model, it's the operating model.<\u002Fp>\n  <div class=\"trows\">\n    <div class=\"trow\"><b>HOME CARE<\u002Fb><span>10,000 jobs on the grid · 9,991 close themselves<\u002Fspan><span class=\"hold\">9 HOLD FOR YOU<\u002Fspan><\u002Fdiv>\n    <div class=\"trow\"><b>UTILITIES<\u002Fb><span>700K invoices a month, entity-resolved across 15,000+ vendors<\u002Fspan><span class=\"hold\">1 IN 100 HELD<\u002Fspan><\u002Fdiv>\n    <div class=\"trow\"><b>FRAUD<\u002Fb><span>129 signals assembled per case<\u002Fspan><span class=\"hold\">1 DECISION · YOURS<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid2\" id=\"floorgrid\" aria-hidden=\"true\"><\u002Fdiv>\n  <div class=\"iaoband\" id=\"iaoband\" style=\"margin:44px 0 0;border:1px solid #31463A;position:relative\">\n    <svg viewBox=\"0 0 1180 290\" style=\"width:100%;display:block\" role=\"img\" aria-label=\"One sequence: integrate fragmented systems onto one rail, automate the repeatable along it, orchestrate exceptions up to a person.\">\n      <defs>\n        <path id=\"iaorail\" d=\"M150 170 L1010 170\"><\u002Fpath>\n        <path id=\"iaoexc\" d=\"M150 170 L820 170 C 880 170 890 96 952 96\"><\u002Fpath>\n      <\u002Fdefs>\n      <line x1=\"393\" y1=\"24\" x2=\"393\" y2=\"266\" stroke=\"#1D2F24\" stroke-width=\"1.2\"><\u002Fline>\n      <line x1=\"786\" y1=\"24\" x2=\"786\" y2=\"266\" stroke=\"#1D2F24\" stroke-width=\"1.2\"><\u002Fline>\n      <text x=\"36\" y=\"248\" font-family=\"ui-monospace,Menlo,monospace\" font-size=\"44\" font-weight=\"800\" fill=\"#17281D\">01<\u002Ftext>\n      <text x=\"429\" y=\"248\" font-family=\"ui-monospace,Menlo,monospace\" font-size=\"44\" font-weight=\"800\" fill=\"#17281D\">02<\u002Ftext>\n      <text x=\"822\" y=\"248\" font-family=\"ui-monospace,Menlo,monospace\" font-size=\"44\" font-weight=\"800\" fill=\"#17281D\">03<\u002Ftext>\n      <g class=\"iaodraw\">\n        <rect x=\"46\" y=\"70\" width=\"34\" height=\"24\" fill=\"none\" stroke=\"#5A6E60\" stroke-width=\"1.8\" pathLength=\"1\"><\u002Frect>\n        <rect x=\"40\" y=\"128\" width=\"34\" height=\"24\" fill=\"none\" stroke=\"#5A6E60\" stroke-width=\"1.8\" pathLength=\"1\"><\u002Frect>\n        <rect x=\"46\" y=\"186\" width=\"34\" height=\"24\" fill=\"none\" stroke=\"#5A6E60\" stroke-width=\"1.8\" pathLength=\"1\"><\u002Frect>\n        <path d=\"M80 82 C 118 82 118 170 150 170\" fill=\"none\" stroke=\"#5A6E60\" stroke-width=\"1.8\" pathLength=\"1\"><\u002Fpath>\n        <path d=\"M74 140 C 112 140 116 170 150 170\" fill=\"none\" stroke=\"#5A6E60\" stroke-width=\"1.8\" pathLength=\"1\"><\u002Fpath>\n        <path d=\"M80 198 C 118 198 118 170 150 170\" fill=\"none\" stroke=\"#5A6E60\" stroke-width=\"1.8\" pathLength=\"1\"><\u002Fpath>\n      <\u002Fg>\n      <path class=\"iaorailv\" d=\"M150 170 L1010 170\" fill=\"none\" stroke=\"#8FA294\" stroke-width=\"2.6\" style=\"stroke-dasharray:860;stroke-dashoffset:860\"><\u002Fpath>\n      <g class=\"iaostn\">\n        <rect x=\"470\" y=\"163\" width=\"14\" height=\"14\" fill=\"#1D2F24\" stroke=\"#8FA294\" stroke-width=\"1.6\"><\u002Frect>\n        <rect x=\"560\" y=\"163\" width=\"14\" height=\"14\" fill=\"#1D2F24\" stroke=\"#8FA294\" stroke-width=\"1.6\"><\u002Frect>\n        <rect x=\"650\" y=\"163\" width=\"14\" height=\"14\" fill=\"#1D2F24\" stroke=\"#8FA294\" stroke-width=\"1.6\"><\u002Frect>\n      <\u002Fg>\n      <path class=\"iaoexcv\" d=\"M820 170 C 880 170 890 96 952 96\" fill=\"none\" stroke=\"#EFEAD8\" stroke-width=\"2.6\" style=\"stroke-dasharray:220;stroke-dashoffset:220\"><\u002Fpath>\n      <g class=\"iaogate\">\n        <rect x=\"943\" y=\"87\" width=\"18\" height=\"18\" fill=\"#EFEAD8\" transform=\"rotate(45 952 96)\"><\u002Frect>\n        <text x=\"978\" y=\"102\" font-family=\"ui-monospace,Menlo,monospace\" font-size=\"16\" font-weight=\"600\" fill=\"#EFEAD8\">a person decides<\u002Ftext>\n      <\u002Fg>\n      <circle class=\"iaodot\" r=\"4\" fill=\"#8FA294\"><animateMotion dur=\"7s\" repeatCount=\"indefinite\" begin=\"0s\"><mpath href=\"#iaorail\"><\u002Fmpath><\u002FanimateMotion><\u002Fcircle>\n      <circle class=\"iaodot\" r=\"4\" fill=\"#8FA294\"><animateMotion dur=\"7s\" repeatCount=\"indefinite\" begin=\"2.4s\"><mpath href=\"#iaorail\"><\u002Fmpath><\u002FanimateMotion><\u002Fcircle>\n      <circle class=\"iaodot\" r=\"5\" fill=\"#EFEAD8\"><animateMotion dur=\"7s\" repeatCount=\"indefinite\" begin=\"4.8s\"><mpath href=\"#iaoexc\"><\u002Fmpath><\u002FanimateMotion><\u002Fcircle>\n      <g font-family=\"ui-monospace,Menlo,monospace\">\n        <g class=\"iaocap\" data-k=\"0\">\n          <path d=\"M40 30 L52 36 L40 42 M54 30 L66 36 L54 42\" stroke=\"#EFEAD8\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath>\n          <text x=\"82\" y=\"42\" font-size=\"19\" font-weight=\"700\" letter-spacing=\"3\" fill=\"#EFEAD8\">INTEGRATE<\u002Ftext>\n          <text x=\"36\" y=\"70\" font-size=\"16\" fill=\"#8FA294\">fragmented data, one golden record<\u002Ftext>\n        <\u002Fg>\n        <g class=\"iaocap\" data-k=\"1\">\n          <path d=\"M436 28 h20 m-20 9 h20 m-20 9 h20\" stroke=\"#EFEAD8\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath>\n          <text x=\"474\" y=\"42\" font-size=\"19\" font-weight=\"700\" letter-spacing=\"3\" fill=\"#EFEAD8\">AUTOMATE<\u002Ftext>\n          <text x=\"429\" y=\"70\" font-size=\"16\" fill=\"#8FA294\">straight-through, priced per step<\u002Ftext>\n        <\u002Fg>\n        <g class=\"iaocap\" data-k=\"2\">\n          <path d=\"M826 44 C 838 44 838 28 850 28\" stroke=\"#EFEAD8\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath><rect x=\"846\" y=\"24\" width=\"8\" height=\"8\" fill=\"#EFEAD8\" transform=\"rotate(45 850 28)\"><\u002Frect>\n          <text x=\"866\" y=\"42\" font-size=\"19\" font-weight=\"700\" letter-spacing=\"3\" fill=\"#EFEAD8\">ORCHESTRATE<\u002Ftext>\n          <text x=\"822\" y=\"70\" font-size=\"16\" fill=\"#8FA294\">exceptions rise to a person<\u002Ftext>\n        <\u002Fg>\n      <\u002Fg>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  <div class=\"filter40\" style=\"margin:40px 0 0;border:1px solid #31463A;padding:20px 22px\">\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\" id=\"f40row\" aria-label=\"Ten nominated AI use cases; four struck by the readiness review\"><\u002Fdiv>\n    <p class=\"quiet\" style=\"margin-top:14px\">About <b style=\"color:#EFEAD8\">40% of nominated AI use cases don't clear my readiness review.<\u002Fb> The filter is the method.<\u002Fp>\n    <p class=\"quiet\" style=\"margin-top:6px\">\"You're not paying for AI readiness. You're paying for operational improvement. <b style=\"color:#EFEAD8\">The readiness is the compound return.<\u002Fb>\"<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"facts\">\n    <button class=\"cta ghost shiftdoor\" id=\"openShift\" type=\"button\" style=\"border-color:#EFEAD8;color:#EFEAD8\">Take the 90-second shift<\u002Fbutton>\n    <a class=\"cta\" href=\"mailto:ap.applyy@gmail.com?subject=Executive%20Conversation%20-%20Azhar%20Khan\" style=\"background:#EFEAD8;border-color:#EFEAD8;color:#101E15\">Email Azhar Khan<\u002Fa>\n    <span class=\"quiet\">integrate · automate · orchestrate · the sequence is the differentiator<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"pivot\" id=\"work\" style=\"margin-top:0\">\n<div class=\"frame\">\n  <div class=\"entry\">Workflow Redesign · Azhar Khan<\u002Fdiv>\n  <h2>Decision rights, drawn before an agent ships: automate what repeats, assist what varies, <u>reserve what carries risk<\u002Fu>. That drawing is the redesign.<\u002Fh2>\n  <p class=\"pline\"><b>Every step gets the cheapest mechanism that can carry it. I price the step before I automate it.<\u002Fb><\u002Fp>\n  <div class=\"costs\">\n    <div class=\"cost\"><b>Under 3 cents<\u002Fb> per outcome.<\u002Fdiv>\n    <div class=\"cost\">Consumption <b>down 39%<\u002Fb> year over year while volume grew.<\u002Fdiv>\n    <div class=\"cost\"><b>About 40%<\u002Fb> of nominated AI use cases don't clear my readiness review.<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"chips\">\n    <div class=\"chip\"><div class=\"clab\">BOTTLENECK<\u002Fdiv><p>One person or one step where every case queues, regardless of how fast the rest of the system runs.<\u002Fp><\u002Fdiv>\n    <div class=\"chip\"><div class=\"clab\">RUBBER STAMP<\u002Fdiv><p>An approval step that signs off without checking anything. I remove it or give it real evidence to check.<\u002Fp><\u002Fdiv>\n    <div class=\"chip\"><div class=\"clab\">CRUMPLE ZONE<\u002Fdiv><p>The point where every piece of disorder automation didn't fix lands on one person to absorb by hand.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  \n<\u002Fdiv>\n<\u002Fsection>\n<div class=\"fileseam\" style=\"background:var(--void);padding:0 0 72px\">\n<div class=\"frame\" style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;border-top:1px solid var(--dline);padding-top:18px\">\n  <span style=\"font:700 13px/1 var(--mono);letter-spacing:.2em;color:var(--dwhite)\">THE FILE<\u002Fspan>\n  <span style=\"font:500 11px/1.6 var(--mono);color:var(--haze)\">the work in full · reads by scroll alone · prints as paper<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"frame\">\n<section class=\"simsec\" id=\"sim\">\n  <div class=\"entry\">The same stream, two operating models · live simulation<\u002Fdiv>\n  <div class=\"simgrid\">\n    <div class=\"simcard\">\n      <div class=\"simhead\"><b>Before<\u002Fb><span>swivel-chair operations<\u002Fspan><\u002Fdiv>\n      <div class=\"simcanvas\"><canvas id=\"sim-before\" role=\"img\" aria-label=\"Simulation: work items spiral into a queue behind one overloaded person; items redden as they age near the center.\"><\u002Fcanvas><div class=\"simlab is-hum\">SWIVEL-CHAIR OPERATIONS<\u002Fdiv><\u002Fdiv>\n      <p class=\"simstat is-hum\">Waiting on one person: <b id=\"q-before\">0<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"simcard\">\n      <div class=\"simhead\"><b>After<\u002Fb><span>governed autonomy<\u002Fspan><\u002Fdiv>\n      <div class=\"simcanvas\"><canvas id=\"sim-after\" role=\"img\" aria-label=\"Simulation: work flows agent to agent around a shared gate; exceptions pause, verify, and release.\"><\u002Fcanvas><div class=\"simlab is-sys\">GOVERNED AUTONOMY<\u002Fdiv><\u002Fdiv>\n      <p class=\"simstat is-sys\">Released through the gate: <b id=\"q-after\">0<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"simlegend\"><span><i class=\"dotk\"><\u002Fi> Work moving through the flow<\u002Fspan><span><i class=\"dotx\"><\u002Fi> Exception, held for verification<\u002Fspan><span>seeded identically on every visit<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<div class=\"frame\">\n\n\n<section class=\"case\" id=\"case-thekey\">\n  <div class=\"entry\">Transformation 01 · TheKey<\u002Fdiv>\n  <p class=\"scene\"><i>02:11<\u002Fi> · a rate batch stages itself, every client agreement. It waits on one signature.<\u002Fp>\n  <h3 class=\"lede\">One governed control plane runs eleven business functions end to end.<\u002Fh3>\n  <div class=\"sir\">\n    <div class=\"sir-row\"><div class=\"k\">Situation<\u002Fdiv><div class=\"v\">Eleven functions, disconnected systems, people carrying work between screens.<\u002Fdiv><\u002Fdiv>\n    <div class=\"sir-row\"><div class=\"k\">Target operating model<\u002Fdiv><div class=\"v\"><b>450 workflows from 3,650 shared services across 35 systems.<\u002Fb> Failure paths engineered before features.<\u002Fdiv><\u002Fdiv>\n    <div class=\"sir-row\"><div class=\"k\">The single view<\u002Fdiv><div class=\"v\"><b>Twenty governed AI use cases on one enterprise MCP layer<\u002Fb> · one golden record runs the business and the agents.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"band\">\n    <div class=\"b1\"><div class=\"bn\">170M<\u002Fdiv><div class=\"bt\">tasks a year<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn\">97.6%<\u002Fdiv><div class=\"bt\">completion across 24.5M runs over five years, zero business-interrupting outages<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn\">$30M+<\u002Fdiv><div class=\"bt\">measured impact since 2021<\u002Fdiv><\u002Fdiv>\n    <div class=\"b1\"><div class=\"bn red\">9 in 10,000<\u002Fdiv><div class=\"bt\">escalation rate · 99.91% straight-through<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"decs\">\n    <div class=\"dec\"><b>Return:<\u002Fb> 35 systems under one governed layer, no rewrite since 2021.<\u002Fdiv>\n    <div class=\"dec\"><b>Cost:<\u002Fb> point-to-point integrations ruled out; shared services stood up once, reused everywhere.<\u002Fdiv>\n    <div class=\"dec\"><b>Controls:<\u002Fb> fail-closed batches, bounded retries, 3,175 typed error codes. Exception management by design.<\u002Fdiv>\n    <div class=\"dec\"><b>Audit:<\u002Fb> scored the client's own AI stack, <span style=\"color:var(--hum);font-weight:600\">ruled all three proposed use cases unsafe<\u002Fspan>, delivered a phased path at no new spend.<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"blocks5\">\n    <div class=\"b5\"><div class=\"k\">DATA<\u002Fdiv><div class=\"v\">One source of truth; every system feeds it, every decision reads it.<\u002Fdiv><\u002Fdiv>\n    <div class=\"b5\"><div class=\"k\">IDENTITY<\u002Fdiv><div class=\"v\">Every action carries a name: human, robot, or agent.<\u002Fdiv><\u002Fdiv>\n    <div class=\"b5\"><div class=\"k\">OBSERVABILITY<\u002Fdiv><div class=\"v\">The platform watches itself; every job reports what it did.<\u002Fdiv><\u002Fdiv>\n    <div class=\"b5\"><div class=\"k\">EXCEPTIONS<\u002Fdiv><div class=\"v\">Failures arrive with instructions: retry, halt, or hand to a person.<\u002Fdiv><\u002Fdiv>\n    <div class=\"b5\"><div class=\"k\">GOVERNANCE<\u002Fdiv><div class=\"v\">Every release passes review; every exception has a reason on file.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bigfield rv\">\n    <div class=\"maphead\">\n      <div class=\"maptitle\">Ten thousand jobs, one month of the floor<\u002Fdiv>\n      <div class=\"fieldhint\">hover the solid cells · <em>find the nine<\u002Fem><\u002Fdiv>\n    <\u002Fdiv>\n    <canvas id=\"bigcare\" width=\"1000\" height=\"1000\" role=\"img\" aria-label=\"Grid of 10,000 cells, one per job; exactly 9 red cells mark where a person acts.\"><\u002Fcanvas>\n    <div class=\"fieldcap\">each cell = one job · <em>the solid nine<\u002Fem> carry names · <span id=\"foundcount\">found 0 of 9<\u002Fspan><\u002Fdiv>\n    <div class=\"mtip\" id=\"bigtip\"><\u002Fdiv>\n  <\u002Fdiv>\n\n<div class=\"mapshell rv\">\n<div class=\"maphost\" data-map=\"care\">\n<button class=\"fsbtn\" type=\"button\" aria-label=\"View care map full screen\">⛶ Full screen<\u002Fbutton>\n<div class=\"avm-root\" id=\"avm-care\" data-variant=\"a\">\n<div class=\"avm-bar\" role=\"toolbar\" aria-label=\"Care map layers\">\n<span class=\"avm-lab\">LAYERS<\u002Fspan>\n<div class=\"avm-grp\">\n<button class=\"avm-tgl\" type=\"button\" data-ov=\"agentics\" aria-pressed=\"true\">AI nodes<\u002Fbutton>\n<button class=\"avm-tgl\" type=\"button\" data-ov=\"activation\" aria-pressed=\"false\">Activation loop<\u002Fbutton>\n<button class=\"avm-tgl\" type=\"button\" data-ov=\"exceptions\" aria-pressed=\"false\">Exceptions<\u002Fbutton>\n<button class=\"avm-tgl\" type=\"button\" data-ov=\"offnet\" aria-pressed=\"true\">Off-network<\u002Fbutton>\n<button class=\"avm-tgl\" type=\"button\" data-ov=\"receipts\" aria-pressed=\"false\">How to read it<\u002Fbutton>\n<\u002Fdiv>\n<span class=\"avm-spacer\"><\u002Fspan>\n<button class=\"avm-print\" type=\"button\" id=\"printBtn-care\">Print<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"avm-svgscroll\">\n<div id=\"tip-care\" class=\"map-tip\" role=\"status\"><\u002Fdiv>\n<svg id=\"map-care\" viewBox=\"0 150 2280 1130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"group\" aria-label=\"TheKey operating map\">\n<rect width=\"2280\" height=\"1780\" fill=\"#fff\"><\u002Frect>\n<rect x=\"70\" y=\"44\" width=\"30\" height=\"22\" rx=\"2\" fill=\"#16324c\"><\u002Frect><text x=\"85\" y=\"60\" fill=\"#fff\" font-size=\"12.5\" font-weight=\"800\" text-anchor=\"middle\">02<\u002Ftext>\n<text x=\"114\" y=\"60\" fill=\"#5b6b7a\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"2.5\">AGENTIC ORCHESTRATION · NATIONAL HOME CARE: OPERATIONS<\u002Ftext>\n<text x=\"2210\" y=\"60\" fill=\"#9aa4ad\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"2\" text-anchor=\"end\">DIAGRAM 02 / 03<\u002Ftext>\n<text x=\"70\" y=\"112\" fill=\"#16324c\" font-size=\"44\" font-weight=\"800\">The enterprise that runs itself.<\u002Ftext>\n<text x=\"70\" y=\"142\" fill=\"#3a4750\" font-size=\"17\">A national care operation run by one team across eleven business functions. Humans touch 9 of every 10,000 jobs. Judgment goes to a person; everything else closes itself.<\u002Ftext>\n<rect x=\"70\" y=\"158\" width=\"2140\" height=\"2.5\" fill=\"#16324c\"><\u002Frect>\n<line x1=\"498\" y1=\"166\" x2=\"498\" y2=\"214\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"926\" y1=\"166\" x2=\"926\" y2=\"214\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1354\" y1=\"166\" x2=\"1354\" y2=\"214\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"1782\" y1=\"166\" x2=\"1782\" y2=\"214\" stroke=\"#e2e6ea\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"70\" y1=\"216\" x2=\"2210\" y2=\"216\" stroke=\"#d3d8dd\" stroke-width=\"1.5\"><\u002Fline>\n<text x=\"88\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">DATA<\u002Ftext><text x=\"88\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">one source of truth · every system feeds it · every decision reads it<\u002Ftext>\n<text x=\"516\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">IDENTITY<\u002Ftext><text x=\"516\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">every action has a name on it: human, robot, or agent<\u002Ftext>\n<text x=\"944\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">OBSERVABILITY<\u002Ftext><text x=\"944\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">the platform watches itself · every job reports what it did<\u002Ftext>\n<text x=\"1372\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">EXCEPTIONS<\u002Ftext><text x=\"1372\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">failures arrive with instructions: retry, halt, or hand to a person<\u002Ftext>\n<text x=\"1800\" y=\"185\" fill=\"#16324c\" font-size=\"12.5\" font-weight=\"700\">GOVERNANCE<\u002Ftext><text x=\"1800\" y=\"204\" fill=\"#5f6a74\" font-size=\"11\">nothing ships without review · nothing stays without reason<\u002Ftext>\n<rect x=\"70\" y=\"226\" width=\"2140\" height=\"1030\" rx=\"26\" fill=\"#fff\" stroke=\"#e4e7ea\" stroke-width=\"1.5\"><\u002Frect>\n<rect x=\"71\" y=\"227\" width=\"2138\" height=\"1028\" rx=\"26\" fill=\"#f9f7f1\" opacity=\".5\"><\u002Frect>\n<text x=\"96\" y=\"256\" fill=\"#9aa4ad\" font-size=\"12.5\" font-style=\"italic\">Every workflow rides one substrate: the same identity, logging, and error handling on every hop, batch or real-time<\u002Ftext>\n<line x1=\"90\" y1=\"300\" x2=\"2190\" y2=\"300\" stroke=\"#8a95a0\" stroke-width=\"1\" opacity=\".08\"><\u002Fline>\n<line x1=\"90\" y1=\"352\" x2=\"2190\" y2=\"352\" stroke=\"#8a95a0\" stroke-width=\"1\" opacity=\".08\"><\u002Fline>\n<line x1=\"90\" y1=\"404\" x2=\"2190\" y2=\"404\" stroke=\"#8a95a0\" stroke-width=\"1\" opacity=\".08\"><\u002Fline>\n<line x1=\"90\" y1=\"456\" x2=\"2190\" y2=\"456\" stroke=\"#8a95a0\" stroke-width=\"1\" opacity=\".08\"><\u002Fline>\n<line x1=\"90\" y1=\"508\" x2=\"2190\" y2=\" >ONE SOURCE OF TRUTH<\u002Ftext>\n<text x=\"1370\" y=\"456\" fill=\"#5b98a4\" font-size=\"12\" letter-spacing=\"1\" text-anchor=\"middle\">RAW → CURATED → ACTIVATED · all seven streams meet here<\u002Ftext>\n<text x=\"1198\" y=\"500\" fill=\"#4a8fa0\" font-size=\"11.5\"><tspan font-weight=\"700\">identity resolution layer<\u002Ftspan> · master keys: the only place IDs reconcile<\u002Ftext>\n<text x=\"1198\" y=\"522\" fill=\"#4a8fa0\" font-size=\"11.5\"><tspan font-weight=\"700\">crosswalks<\u002Ftspan> · 353-row Subsidiary–Agency lookup<\u002Ftext>\n<text x=\"1198\" y=\"902\" fill=\"#4a8fa0\" font-size=\"11.5\"><tspan font-weight=\"700\">count reconciliation checks<\u002Ftspan> · anomalous loads halt their dependents<\u002Ftext>\n<text x=\"1198\" y=\"924\" fill=\"#4a8fa0\" font-size=\"11.5\"><tspan font-weight=\"700\">reverse-ETL out<\u002Ftspan> · curated views distribute · activation flows out<\u002Ftext>\n<g id=\"ln-gtm\" class=\"line-g\">\n<path d=\"M170 360 L718 360 Q760 360 760 402 L760 478 Q760 520 802 520 L860 520\" fill=\"none\" stroke=\"#c2417f\" stroke-width=\"9\"><\u002Fpath>\n<text x=\"174\" y=\"338\" fill=\"#c2417f\" font-size=\"15\" font-weight=\"800\" letter-spacing=\"1\">DEMAND-TO-LEAD<\u002Ftext>\n<text x=\"365\" y=\"338\" fill=\"#9aa4ad\" font-size=\"11.5\" font-style=\"italic\">first touch to qualified lead<\u002Ftext>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Dynamic numbers on every campaign; calls route through IVR to regional intake. Polling triggers land call-tracking and form data nightly.\" data-name=\"Call Tracking · DNI\" data-line=\"DEMAND-TO-LEAD\"><circle cx=\"240\" cy=\"360\" r=\"9\" fill=\"#c2417f\"><\u002Fcircle><text x=\"240\" y=\"390\" fill=\"#3a4750\" font-size=\"12\" text-anchor=\"middle\">Call Tracking<\u002Ftext><text x=\"240\" y=\"405\" fill=\"#3a4750\" font-size=\"12\" text-anchor=\"middle\">DNI<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Paid social and search feed the funnel; spend lands in kflow · caregiver role assignment runs as a production recipe.\" data-name=\"Identity Provisioning\" data-line=\"HIRE-TO-RETIRE\"><circle cx=\"930\" cy=\"440\" r=\"9\" fill=\"#e8963d\"><\u002Fcircle><text x=\"930\" y=\"470\" fill=\"#3a4750\" font-size=\"12\" text-anchor=\"middle\">Identity<\u002Ftext><text x=\"930\" y=\"485\" fill=\"#3a4750\" font-size=\"12\" text-anchor=\"middle\">Provisioning<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Consent-gated intro videos assembled by an unattended robot; the API only reads metadata back to the platform.\" data-name=\"Candidate Video Profile\" data-line=\"HIRE-TO-RETIRE\"><circle cx=\"1730\" cy=\"470\" r=\"9\" fill=\"#e8963d\"><\u002Fcircle><rect class=\"aibadge\" x=\"1738\" y=\"450\" width=\"14\" height=\"14\" rx=\"3\" transform=\"rotate(45 1745 457)\" fill=\"#fff\" stroke=\"#4a90c2\" stroke-width=\"2\" opacity=\"1\"><\u002Frect><text x=\"1730\" y=\"436\" fill=\"#3a4750\" font-size=\"12\" text-anchor=\"middle\">Candidate Video Profile<\u002Ftext><\u002Fg>\n<g class=\"station\" tabindex=\"0\" data-tip=\"Office staff deliver the introduction · a designed human touchpoint between AI output and the client.\" data-name=\"Client Intro Delivered\" data-line=\"HIRE-TO-RETIRE\"><circle cx=\"1950\" cy=\"470\" r=\"10\" fill=\"#fff\" stroke=\"#e8963d\" stroke-width=\"4\"><\u002Fcircle><text x=\"1950\" y=\"436\" fill=\"#3a4750\" font-size=\"12\" text-anchor=\"middle\">Client<\u002Ftext><text x=\"1950\" y=\"451\" fill=\"#3a4750\" font-size=\"12\" text-anchor=\"middle\">Intro Delivered<\u002Ftext><\u002Fg>\n<\u002Fg>\n<g id=\"ln-rev\" class=\"line-g\">\n<path d=\"M170 620 L658 620 Q700 620 700 570 Q700 520 742 520 L818 520 Q860 520 902 520 L958 520 Q1000 520 1000 562 L1000 598 Q1000 640 1042 640 L1138 640 Q1180 640 1222 640 L1518 640 Q1560 640 1602 640 L1658 640 Q1700 640 1700 600 Q1700 560 1742 560 L2110 560\" fill=\"none\" stroke=\"#2f9e4f\" stroke-width=\"9\"><\u002Fpath>\n<text x=\"174\" y=\"598\" fill=\"#2f9
